# IceMine - alap beállítások
# A legtöbb változtatás után elég: /icemine reload
# Az adatbázis beállításainak módosításához viszont újraindítás kell.

database:
  # sqlite: egy fájlban tárol mindent (kisebb szerverhez ez a jó)
  # mysql / mariadb: külön adatbázis szerver (ha később a weboldallal is össze akarod kötni)
  type: sqlite
  file: icemine.db
  host: localhost
  port: 3306
  name: icemine
  user: root
  password: ""
  ssl: false

# IceCoin: a játékosok weboldalas egyenlege. A scoreboard ezt mutatja (%icecoin%), a szerver csak olvassa.
skins:
  # A SkinsRestorer csak ezen a szerveren van, a proxyn nincs. Induláskor kikapcsoljuk a proxy módját,
  # különben Velocity mögött nem tenné fel a weboldalas skineket. Ha a proxyra is felteszed, írd false-ra.
  backend-only: true

icecoin:
  enabled: true
  # A weboldal címe (ahol a játékosok regisztrálnak)
  url: "https://icemine.hu"
  # Ha a weboldal .env fájljába beírod: MC_API_KEY=valami, akkor ide is ugyanazt írd (így más nem kérdezheti le az egyenlegeket)
  api-key: ""
  # Ennyi másodpercenként frissül
  refresh-seconds: 30

# Belépés a weboldalas jelszóval: a /login jelszavát a weboldal ellenőrzi (az icecoin.url címen, az icecoin.api-key kulccsal).
# Ha jó, a szerveres (AuthMe) jelszó is erre változik. Ha a weboldalon megváltoztatod a jelszót, a következő belépéstől az új jó.
weboldal-belepes:
  enabled: true
  # Ennyi rossz jelszó után kidob
  probalkozas: 5
  # Akinek nincs weboldalas fiókja, de régen a szerveren regisztrált, beléphet a régi szerveres jelszavával
  regi-fiokok: true
  # Lehessen-e a szerveren regisztrálni (/register). false = csak a weboldalon
  szerveren-regisztracio: false
  # Ezt a címet írja ki a játékosoknak (üresen: az icecoin.url-ből)
  weboldal: "icemine.hu"

# A weboldalon vett rangok: a szerver az IceCoinnal együtt lekérdezi a rangot is (icecoin.refresh-seconds időnként),
# és ha valakinek a weboldalon rangja van, megkapja a hozzá tartozó LuckPerms csoportot. Ha lejár, leveszi.
# A kézzel adott rangokhoz (lp user ... parent add ...) nem nyúl.
weboldal-rangok:
  enabled: true
  # weboldalas rang neve: LuckPerms csoport
  rangok:
    Bronz: bronz
    Wizard: wizard
    Abyss: wizard
    IceKing: iceking
    Yeti: yeti

# Chat napló: minden chat üzenet (a királysági és szövetségi is), parancs, be- és kilépés naponta egy fájlba kerül:
# plugins/IceMine/chatlog/ÉÉÉÉ-HH-NN.log. A jelszavas parancsoknál (/login, /register...) a jelszó helyett csillag van.
# Játékban: /icem chatlog [játékos] [oldal]. keep-days: ennyi napnál régebbi naplókat törli.
chatlog:
  enabled: true
  commands: true
  joins: true
  keep-days: 30

# Automatikus frissítés: 10 percenként megnézi a GitHubon, van-e új IceMine. Ha van, letölti a plugins/update
# mappába, és a szerver következő újraindításakor magától felrakja (Git Pull nem kell). Kézzel: /icem update
# restart-when-empty: ha true, letöltött frissítésnél, amikor 2 perce senki nincs fent, újraindítja a szervert.
#   Csak akkor kapcsold be, ha a panel leállás után magától újraindítja a szervert.
auto-update:
  enabled: true
  check-minutes: 10
  restart-when-empty: false
  # A többi plugin jarját is frissíti a GitHub plugins mappájából (új plugint is letölt).
  plugins: true
  repo-raw: "https://raw.githubusercontent.com/ingyen-200-koveto/Szerver/main"

# A játékosok feje fölött: a név előtt a rang, a név mellett az életerő (pl. "Peti 20❤").
# A rang a LuckPerms előtag, ha be van állítva, különben az IceMine rang neve (ranks.yml). Alap rangnál nem ír ki semmit.
# BedWars meccsben a rang helyett a csapat színe látszik. Ha a TAB fent van, a rangot a TAB-on keresztül írja ki.
nametags:
  enabled: true
  rank: true
  health: true
  # beside: a név mellett | below: a név alatt
  health-position: beside
  # A név mögé írt életerő, %hp% = az életerő (20 = tele)
  health-format: " &c%hp%&4❤"
  # A név alatti kijelzés felirata (csak health-position: below esetén)
  health-title: "&c❤"
  disabled-worlds: []

# Ennyi másodpercenként menti a pénzt, statisztikákat és a Gens adatokat.
autosave-seconds: 60

# Az admin parancsok naplózása az adatbázisba is (a konzolba mindig kiírja).
admin-log: true

# Ezeket a parancsokat a játékosok nem használhatják, és a TAB-os kiegészítésben sem látják.
# Aki mégis beírja, ezt kapja: [IceMine] Ehhez nincs jogod!
# Az adminok és az owner (icemine.admin.commands jog) ugyanúgy használhatják őket.
# A "bukkit:pl" és hasonló alakokat is tiltja. Ide azok a parancsok kerültek, amik pluginlistát vagy verziót árulnak el.
blocked-commands: [pl, plugins, ver, version, about, icanhasbukkit, timings, spark, paper, purpur, bukkit, spigot, tps, mspt,
  lp, luckperms, lpb, perm, perms, permission, permissions, tab, btab, via, viaver, viaversion, vvbukkit, viabackwards, viarewind]

# Az AuthMe és az EssentialsX üzeneteit is [IceMine] előtaggal írja ki (magyarul).
# Az IceMine egyszer kirakja a saját üzenetfájljait a pluginok mappájába (a régit .regi néven elmenti).
# Ha nem kéred, írd át false-ra.
kulso-uzenetek: true

# Belépési és kilépési üzenet. Ha üres, nem ír ki semmit.
join-message: "&8[&a+&8] %prefix%%player%"
quit-message: "&8[&c-&8] %prefix%%player%"

# Toplisták (hologramok, /top menü). Percenként frissülnek.
leaderboards:
  size: 10
  boards:
    szint:
      title: "&b&l✦ Legmagasabb szint"
      source: stat
      key: level.xp
    fyland:
      title: "&a&l⛏ OneBlock blokkok"
      source: stat
      key: fyland.blocks
    gens:
      title: "&a&l⛃ Gens bevétel"
      source: stat
      key: gens.earned
    parkour:
      title: "&f&l⏱ Parkour rekordok"
      source: stat
      key: parkour3.best_ms
      ascending: true
      format: time
    combo:
      title: "&3&l✦ Legnagyobb kombó"
      source: stat
      key: combofly.best
    duelswins:
      title: "&e&l⚔ Duels győzelmek"
      source: stat
      key: duels.wins
    duelsstreak:
      title: "&6&l⚡ Duels győzelmi sorozat"
      source: stat
      key: duels.best_streak
    duelselo:
      title: "&b&l✦ Legjobb Elo"
      source: stat
      key: duels.elo_best
    bedwarswins:
      title: "&6&l🛏 BedWars győzelmek"
      source: stat
      key: bedwars.wins
    bedwarsfinals:
      title: "&c&l⚔ BedWars végső ölések"
      source: stat
      key: bedwars.final_kills
    skywarswins:
      title: "&b&l☁ SkyWars győzelmek"
      source: stat
      key: skywars.wins
    skywarskills:
      title: "&3&l⚔ SkyWars ölések"
      source: stat
      key: skywars.kills
    combokills:
      title: "&d&l✦ ComboFly ölések"
      source: stat
      key: combofly.kills
    gensprestige:
      title: "&d&l✦ Gens prestige"
      source: stat
      key: gens.prestige_score

# Csendes indítás: indításkor a konzolon csak a figyelmeztetések, a hibák és a végén egy összefoglaló sor látszik.
# A logs/latest.log fájlba ilyenkor is minden bekerül. Ha mindent látni szeretnél a konzolon: false
quiet-startup: true

# Hibafigyelő: a szerver figyelmeztetései és hibái (minden pluginé) a weboldalon át a Discordra kerülnek,
# a ⚠️・szerver-hibák csatornába. Ugyanaz a hiba 30 percenként legfeljebb egyszer jön, a többi csak számolódik.
hiba-figyelo:
  be: true
  # Ez a név látszik a Discordon (pl. Lobby)
  nev: "Lobby"
  # true: csak a hibák (ERROR) jönnek, a figyelmeztetések (WARN) nem
  csak-hibak: false
  # Ha egy sor ezek közül valamelyiket tartalmazza, nem küldi el (a szokásos, ártalmatlan üzenetek már ki vannak hagyva)
  kihagy: []

# Napi mentés: a világok és a pluginok adatai (jarok nélkül) egy zip fájlba: plugins/IceMine/mentesek
# és feltöltés a weboldal szerverére (VPS: /var/lib/icemine/mentesek). Azonnal: /mentes most
mentes:
  be: true
  # Mikor (magyar idő szerint)
  idopont: "04:00"
  # Hány mentés maradjon itt a szerveren (a VPS-en 7 marad)
  helyi-megtart: 3
  # Feltöltés a VPS-re (az icecoin.url és icecoin.api-key kell hozzá)
  feltoltes: true

# Csalásgyanú: ha a GrimAC valakit rövid idő alatt sokszor jelez, kártya megy a Discord 🕵️・csalásgyanú csatornába.
csalasgyanu:
  be: true
  # Ennyi jelzés kell...
  kuszob: 20
  # ...ennyi percen belül
  ablak-perc: 5
  # Ugyanarról a játékosról legfeljebb ennyi percenként jön új kártya
  szunet-perc: 10
  # Ezekkel kezdődő Grim ellenőrzések nem számítanak (pl. ha a ComboFly miatt téves: [Simulation, Knockback])
  kihagy-checkek: []

# Szintek: minden játékból XP jár, a szint a név előtt látszik (chat, TAB, fej fölött).
levels:
  enabled: true
  chat: true
  nametag: true
  # szintlépéskor ennyi Kristály szintenként (szint x ennyi), minden 10. szintnél plusz a reward-every-10
  reward-per-level: 10
  reward-every-10: 250
  # XP szabályok: "xp" vagy "xp / ennyi egységenként". A *.kills minden módra jó, ahol nincs külön szabály.
  xp:
    bedwars.wins: "60"
    bedwars.final_kills: "8"
    bedwars.kills: "4"
    bedwars.beds: "20"
    bedwars.games: "10"
    skywars.wins: "60"
    skywars.kills: "8"
    skywars.games: "10"
    duels.wins: "25"
    duels.played: "5"
    combofly.combos: "1"
    lobby.pvp_kills: "2"
    gens.quests: "25"
    gens.harvested: "1 / 40"
    fyland.blocks: "1 / 15"
    parkour3.completions: "30"
    lobby.snowflakes: "2"
