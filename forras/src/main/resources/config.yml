# IceMine - alap beállítások
# A legtöbb változtatás után elég: /icemine reload
# Az adatbázis beállításainak módosításához viszont újraindítás kell.

database:
  # sqlite: egy fájlban tárol mindent (kisebb szerverhez ez a jó)
  # mysql / mariadb: külön adatbázis szerver (ha később a weboldallal is össze akarod kötni)
  type: sqlite
  file: icemine.db
  host: localhost
  port: 3306
  name: icemine
  user: root
  password: ""
  ssl: false

# IceCoin: a játékosok weboldalas egyenlege. A scoreboard ezt mutatja (%icecoin%), a szerver csak olvassa.
icecoin:
  enabled: true
  # A weboldal címe (ahol a játékosok regisztrálnak)
  url: "https://icemine.hu"
  # Ha a weboldal .env fájljába beírod: MC_API_KEY=valami, akkor ide is ugyanazt írd (így más nem kérdezheti le az egyenlegeket)
  api-key: ""
  # Ennyi másodpercenként frissül
  refresh-seconds: 30

# A játékosok feje fölött: a név előtt a rang, a név mellett az életerő (pl. "Peti 20❤").
# A rang a LuckPerms előtag, ha be van állítva, különben az IceMine rang neve (ranks.yml). Alap rangnál nem ír ki semmit.
# BedWars meccsben a rang helyett a csapat színe látszik. Ha a TAB fent van, a rangot a TAB-on keresztül írja ki.
nametags:
  enabled: true
  rank: true
  health: true
  # beside: a név mellett | below: a név alatt
  health-position: beside
  # A név mögé írt életerő, %hp% = az életerő (20 = tele)
  health-format: " &c%hp%&4❤"
  # A név alatti kijelzés felirata (csak health-position: below esetén)
  health-title: "&c❤"
  disabled-worlds: []

# Ennyi másodpercenként menti a pénzt, statisztikákat és a Gens adatokat.
autosave-seconds: 60

# Az admin parancsok naplózása az adatbázisba is (a konzolba mindig kiírja).
admin-log: true

# Ezeket a parancsokat a játékosok nem használhatják, és a TAB-os kiegészítésben sem látják.
# Aki mégis beírja, ezt kapja: [IceMine] Ehhez nincs jogod!
# Az adminok és az owner (icemine.admin.commands jog) ugyanúgy használhatják őket.
# A "bukkit:pl" és hasonló alakokat is tiltja. Ide azok a parancsok kerültek, amik pluginlistát vagy verziót árulnak el.
blocked-commands: [pl, plugins, ver, version, about, icanhasbukkit, timings, spark, paper, purpur, bukkit, spigot, tps, mspt,
  lp, luckperms, lpb, perm, perms, permission, permissions, tab, btab, via, viaver, viaversion, vvbukkit, viabackwards, viarewind]

# Az AuthMe és az EssentialsX üzeneteit is [IceMine] előtaggal írja ki (magyarul).
# Az IceMine egyszer kirakja a saját üzenetfájljait a pluginok mappájába (a régit .regi néven elmenti).
# Ha nem kéred, írd át false-ra.
kulso-uzenetek: true

# Belépési és kilépési üzenet. Ha üres, nem ír ki semmit.
join-message: "&8[&a+&8] %prefix%%player%"
quit-message: "&8[&c-&8] %prefix%%player%"

# Toplisták (hologramok, /top menü). Percenként frissülnek.
leaderboards:
  size: 10
  boards:
    fullpvp:
      title: "&c&l⚔ FullPvP ölések"
      source: stat
      key: fullpvp.kills
    fyland:
      title: "&a&l⛏ Fyland blokkok"
      source: stat
      key: fyland.blocks
    streak:
      title: "&e&l⚡ Legjobb FullPvP sorozat"
      source: stat
      key: fullpvp.best_streak
    gens:
      title: "&a&l⛃ Gens bevétel"
      source: stat
      key: gens.earned
    parkour:
      title: "&f&l⏱ Parkour rekordok"
      source: stat
      key: parkour2.best_ms
      ascending: true
      format: time
    combo:
      title: "&3&l✦ Legnagyobb kombó"
      source: stat
      key: combofly.best
    duelswins:
      title: "&e&l⚔ Duels győzelmek"
      source: stat
      key: duels.wins
    duelsstreak:
      title: "&6&l⚡ Duels győzelmi sorozat"
      source: stat
      key: duels.best_streak
    duelselo:
      title: "&b&l✦ Legjobb Elo"
      source: stat
      key: duels.elo_best
    bedwarswins:
      title: "&6&l🛏 BedWars győzelmek"
      source: stat
      key: bedwars.wins
    bedwarsfinals:
      title: "&c&l⚔ BedWars végső ölések"
      source: stat
      key: bedwars.final_kills
    combokills:
      title: "&d&l✦ ComboFly ölések"
      source: stat
      key: combofly.kills
    gensprestige:
      title: "&d&l✦ Gens prestige"
      source: stat
      key: gens.prestige_score
