# Duels - 1v1 PvP módok
# A játékos a Duels lobbyban (vagy bárhol a lobbyban) választ módot: /duels
# Kihívás: /duel <játékos> [mód] [bo3] | elfogadás: /duel accept | visszavágó: /duel rematch
# Nézőként: /duels spectate <játékos> | kilépés a sorból vagy nézésből: /duels leave
# Az arénákat az első indításkor a plugin építi fel ebben a világban. Újraépítés: /duels rebuild
#
# Mód beállítások:
#   arena: classic | sumo | bridge | builduhc | crystal (melyik fajta arénán megy)
#   rule: normal | boxing (ütésre megy) | sumo (le kell lökni) | bridge (gólra megy) | combofly (felfelé lökés)
#   target: boxing-nál hány ütés kell, bridge-nél hány gól
#   old-combat: true = 1.8-as harc (nincs ütési várakozás), false = 1.9+ harc (pajzs, balta)
#   hit-delay: két találat közti sérthetetlenség tickben (vanilla 20, kombó 2-5)
#   build: lehet-e építeni és bontani | hunger: éhezés | natural-regen: magától gyógyul-e
#   ranked: lehet-e ranked sorban játszani | permission: csak ezzel a joggal választható
#   Tárgy formátum ugyanaz, mint a KitPvP-ben (pl. "DIAMOND_SWORD 1 sharpness:3 unbreakable").

world: duels
# Ennyi perc után a meccs döntetlen
max-minutes: 10

elo:
  # Mennyit változhat az Elo egy meccsen (minél nagyobb, annál gyorsabban mozog)
  k-factor: 32

rewards:
  win: 10
  ranked-win: 20

arenas:
  classic:
    count: 6
    themes: [forest, desert, ice, nether]
  sumo:
    count: 3
    themes: [forest]
  bridge:
    count: 2
    themes: [forest]
  builduhc:
    count: 2
    themes: [forest]
  crystal:
    count: 2
    themes: [nether]

