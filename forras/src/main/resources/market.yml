# Piac: aukciósház (/ah), csere (/trade), dinamikus bolt (/shopgui), eladás (/sell ha, /sell all), pénz toplista (/baltop),
# lottó (/lottery), kulcsok (lootbox, /kulcs), eladó láda, craftoló, farm blokk.
# Minden piaconként külön működik: a Kingdoms és a Fyland saját pénzzel, saját aukciókkal és saját árakkal.
# Admin: /market give <játékos> <sellchest|crafter|farmblock|key:<kulcs>> [db] | /market draw <piac> (lottó sorsolás most)
#
# Tárgy formátum: ANYAG [darab] [varázslat:szint ...] [name=Név_szóközök_helyett], pl. "DIAMOND_SWORD sharpness:5"

# A piacok: world = a mód világa, currency = a pénznem (economy.yml)
scopes:
  kingdoms:
    world: kingdoms
    currency: dollar
    name: "&6Kingdoms"
  fyland:
    world: fyland
    currency: fyland
    name: "&aFyland"

auction:
  # Egyszerre ennyi tárgyat tehet ki valaki (icemine.market.ah.extra joggal kétszer ennyit)
  max-listings: 5
  # Ennyi óra után lejár a hirdetés, és visszakérhető a "Lejárt tárgyaim" menüben
  duration-hours: 48
  # Ennyi százalékot levonunk az eladótól
  tax-percent: 5
  min-price: 1
  max-price: 1000000000

# Dinamikus bolt: buy = vételár, sell = eladási ár egy kötegért (az item darabszáma a köteg).
# Ha valamiből sokat vesznek, drágul, ha sokat adnak el, olcsóbb lesz (legfeljebb min-factor és max-factor között),
# és óránként recovery-per-hour részével visszaáll az alapár felé. elasticity: ennyi köteg után 2x (vagy 0x) lenne az ár.
# scopes: ha meg van adva, csak ezekben a piacokban látszik. special: eladó láda, craftoló, farm blokk.
shop:
  elasticity: 5000
  min-factor: 0.5
  max-factor: 2.0
  recovery-per-hour: 0.1
