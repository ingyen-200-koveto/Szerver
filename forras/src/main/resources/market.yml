specials:
  sellchest:
    name: "&6&lEladó láda"
    lore:
      - "&7Eladja, amit beleteszel, és felszívja"
      - "&7és eladja, ami a közelébe esik."
      - "&7A pénz a tiéd, akkor is, ha nem vagy fent."
    # Ennyi másodpercenként adja el a tartalmát, és ekkora sugárban szívja fel a leesett tárgyakat
    interval-seconds: 10
    pickup-radius: 2.5
    scopes: [kingdoms, fyland]
  crafter:
    name: "&b&lCraftoló"
    lore:
      - "&7A beletett vasat, aranyat, gyémántot,"
      - "&7szenet, vöröskövet... blokká tömöríti."
      - "&7Tölcsérrel is tölthető és üríthető."
    interval-seconds: 5
    scopes: [fyland]
  farmblock:
    name: "&a&lFarm blokk"
    lore:
      - "&7Betöltve tartja a körülötte lévő chunkokat,"
      - "&7így a farmjaid akkor is mennek, ha nem vagy ott."
    # 1 = 3x3 chunk, 2 = 5x5 chunk
    radius: 1
    max-per-player: 2
    scopes: [fyland]

lottery:
  ticket-price: 10000
  max-tickets: 3
  # Ennyi óránként van sorsolás
  draw-hours: 24
  # A nyertes ennyi kulcsot is kap
  reward-key: galactic
  reward-keys: 2

# Kulcsok (lootbox). weight: esély súly (nagyobb = gyakoribb). announce-below: az ennél kisebb súlyú nyereményt mindenki látja.
keys:
  galactic:
    name: "&5&lGalactic kulcs"
    material: TRIPWIRE_HOOK
    lore:
      - "&7Mindenféle jó dolog lehet benne."
    announce-below: 5
    rewards:
      - {item: "DIAMOND 8", weight: 20}
      - {item: "IRON_BLOCK 4", weight: 20}
      - {item: "GOLDEN_APPLE 4", weight: 15}
      - {money: 5000, weight: 20}
      - {money: 20000, weight: 8}
      - {item: "ENCHANTED_GOLDEN_APPLE", weight: 5}
      - {item: "DIAMOND_PICKAXE efficiency:4 unbreaking:3", weight: 5}
      - {key: legendas, amount: 1, weight: 3}
      - {item: "NETHERITE_INGOT", weight: 2}
  legendas:
    name: "&6&lLegendás kulcs"
    material: TRIPWIRE_HOOK
    lore:
      - "&7Ritka és erős nyeremények."
    announce-below: 10
    rewards:
      - {item: "DIAMOND_BLOCK 4", weight: 20}
      - {money: 50000, weight: 20}
      - {item: "NETHERITE_INGOT 2", weight: 15}
      - {item: "DIAMOND_SWORD sharpness:5 unbreaking:3", weight: 12}
      - {item: "DIAMOND_CHESTPLATE protection:4 unbreaking:3", weight: 12}
      - {item: "ENCHANTED_GOLDEN_APPLE 3", weight: 10}
      - {item: "TOTEM_OF_UNDYING", weight: 8}
      - {item: "ELYTRA", weight: 3}

