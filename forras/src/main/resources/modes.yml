# Játékmódok
# status: open (nyitva) | maintenance (karbantartás) | closed (zárva)
#   Karbantartás alatt csak az icemine.admin.maintenance.bypass joggal lehet belépni.
#   Gyorsan: /icemine maintenance <mód> <on|off|closed>
# world: a mód világa. A skypvp, kitpvp, combofly és gens világát a plugin maga hozza létre (a saját .yml fájljukban állítható).
# server: ha egyszer külön szerverre költözik egy mód, ide írd a Velocity-ben megadott szervernevét.
# inventory: kit (belépéskor/kilépéskor ürül) | persistent (megmarad) | external (egy másik plugin kezeli)
# core-scoreboard: false, ha a mód saját scoreboardot használ (pl. Kingdoms)
# combofly: true csak ott legyen, ahol a ComboFly lökés kell (alapból csak a ComboFly arénában).
#   A többi módban sima, vanilla PvP van.

# Két játékmódváltás között minimum ennyi idő (ms), hogy ne lehessen spammelni.
send-cooldown-ms: 2000

