# IceMine Kingdoms
# Színkódok: &a, &l stb., vagy hex: &#55FF88
# Ha átírsz valamit: /ka reload
#
# Röviden, hogy működik:
#  - /k create <név>: királyság alapítása. /k: a királyság menü (minden innen elérhető).
#  - Földfoglalás chunkonként (/k claim). A földeken csak a tagok építhetnek, a rangjuk jogai szerint.
#  - A Nexus a királyság szíve (/k nexus adja a blokkot). Nélküle nincs építmény és torony.
#  - Nexuspont (NP): tárgyak beadásával (/k rp) vagy pénzért. Ebből vannak a fejlesztések, tornyok, építmények.
#  - Királysági XP és szint: NP beadás, foglalás, ölés és invázió után. Szintenként több föld és tag.
#  - Háború: ellenséges királyság földjén /k invade -> megjelenik a bajnokuk. Ha legyőzitek, a föld a tiétek.
#  - Nemzet: több királyság szövetsége, közös kapcsolatokkal és kasszával.

# A Kingdoms a lobby szerveren fut, ebben a külön (normál, generált) világban.
world: kingdoms

# A spawn várost a plugin építi fel az első indításkor.
# Ha újra akarod építeni: /ka rebuild
spawn:
  built: false

# Ekkora körben nem lehet építeni és PvP-zni a város közepétől.
spawn-protection: 48
# A világ széle (oldalhossz blokkban).
border-size: 6000
# Szörnyek és állatok ebben a világban. A server.properties-ben a lobby miatt ki vannak kapcsolva,
# itt a plugin visszakapcsolja őket.
spawn-monsters: true
spawn-animals: true
# /k home és /k spawn ennyi másodperc után teleportál (ha közben nem mozogsz).
teleport-delay: 3

gamerules:
  announceAdvancements: false
  playersSleepingPercentage: 30
  spawnRadius: 0

starter-kit:
  - "STONE_SWORD 1"
  - "STONE_PICKAXE 1"
  - "STONE_AXE 1"
  - "STONE_SHOVEL 1"
  - "BREAD 16"
  - "TORCH 16"
  - "OAK_LOG 16"
  - "RED_BED 1"

welcome:
  title: "&6&lKingdoms"
  subtitle: "&7Építs, foglalj, uralkodj."

no-kingdom: "&8nincs"

areas:
  spawn: "&b✦ Királyi város"
  wild: "&2Vadon"
  # %color%: a kapcsolat színe (zöld saját, rózsaszín szövetséges, piros ellenség...)
  kingdom: "%color%%kingdom% &7földje"

# Változók: %kingdom% %rank% %members% %kmonline% %claims% %maxclaims% %level% %rp% %bank% %power% %kpower% %here% %online%
# A %masswar% sor csak masswar alatt látszik.
sidebar:
  title: "&6&l♛ Kingdoms ♛"
  lines:
    - ""
    - "&7Királyság: %kingdom%"
    - "&7Rang: %rank%"
    - "&7Szint: &f%level% &8| &7RP: &e%rp%"
    - "&7Tagok: &a%kmonline%&7/&f%members% &8online"
    - "&7Terület: &f%claims%&7/&f%maxclaims% &8chunk"
    - "&7Power: &f%power%"
    - ""
    - "&7Itt: %here%"
    - "%masswar%"
    - ""
    - "&bplay.icemine.hu"

tablist:
  header:
    - ""
    - "&b&l❄ &b&lIce&f&lMine&b&l ❄ &8| &6&lKingdoms"
    - "&7Online: &b%online%"
    - ""
  footer:
    - ""
    - "&7Királyságod: %kingdom%"
    - "&bplay.icemine.hu"
    - ""

chat:
  # Sima chat formátum. %tag% a királyság neve, ha van, %prefix% a rang (IceMineCore-ból).
  format: "%tag%%prefix%&f%player%&8: &7"
  tag: "&8[%color%%kingdom%&8] "
  no-tag: ""
  # Királysági chat (/k chat, vagy ha !-lel kezded az üzenetet).
  kingdom: "&8[&6♛ %kingdom%&8] &e%player%&8: &f"
  # Szövetségi chat (/k chat a): a királyság, a nemzettársak és a szövetségesek látják.
  ally: "&8[&d⚑ Szövetség&8] &8[%color%%kingdom%&8] &d%player%&8: &f"

map:
  header: "&6&lTérkép &8(te vagy a sárga pötty, észak felfelé)"
  legend: " &a■ &7tiétek  &b■ &7nemzet  &d■ &7szövetséges  &e■ &7fegyverszünet  &c■ &7ellenség  &f■ &7más  &8■ &7szabad"

# ---------------------------------------------------------------------------------------------------------------
# Királyságok
# ---------------------------------------------------------------------------------------------------------------

name:
  min: 3
  max: 16

# Ennyi tag fér egy királyságba: alap + szintenként ennyivel több (+ a "Nagyobb létszám" fejlesztés).
members:
  base: 10
  per-level: 2

# A bank pénzneme (economy.yml). Üresen: az alap pénznem.
bank:
  currency: "dollar"

# Ennyi másodpercig él egy meghívó.
invite-seconds: 300
# Ha true, a saját királyságod tagjait is meg tudod ütni.
friendly-fire: false
# Az átnevezés ára a bankból.
rename-cost: 5000

# Királysági szintek: ennyi XP kell az egyes szintekhez (az első mindig 0).
levels:
  xp: [0, 1000, 3000, 7000, 15000, 30000, 60000, 100000, 160000, 250000]
  xp-per-resource-point: 1
  xp-per-claim: 10
  xp-per-kill: 20
  xp-per-invasion: 500

# Földek (chunkok).
# Max föld = base + per-member × tagok + per-level × (szint - 1) + per-upgrade × "Több föld" fejlesztés + Nexus szint bónusz
# Ha a power be van kapcsolva, a királyság powere is korlátozza: power × claims-per-power (de legalább a free).
claims:
  base: 6
  per-member: 2
  per-level: 3
  per-upgrade: 5
  # Az első ennyi föld ingyenes.
  free: 3
  cost:
    resource-points: 200
    bank: 100
  # Csak a meglévő földek mellé lehet foglalni.
  adjacent: true
  # Más királyság földjétől legalább ennyi chunk távolság kell (szövetségesnél és nemzettársnál nem).
  buffer: 5
  # Elengedéskor a foglalási NP ennyi %-át visszakapjátok.
  unclaim-refund-percent: 50
  # A földeken nem robban szét semmi (invázió közben igen, hacsak nincs Robbanásvédelem fejlesztés).
  protect-explosions: true
  # Földre lépéskor cím jelenik meg a királyság nevével.
  titles: true

# Power (mint a Factionsben): online töltődik, halálkor csökken. A királyság powere a tagjaié összesen.
power:
  enabled: true
  max: 10
  min: -5
  initial: 5
  regen-minutes: 10
  regen-amount: 1
  death-loss: 2
  claims-per-power: 2

# Nexuspont: ezeket a tárgyakat lehet beváltani (ANYAG: NP darabonként).
# Egyedi nevű, leírású vagy varázsolt tárgyat nem vált be.
resource-points:
  # Halálkor ennyi NP-t veszít a királyság.
  death-penalty: 10
  # A bankban ennyi pénz = 1 NP.
  money-per-point: 10
  items:
    COAL: 2
    CHARCOAL: 1
    COPPER_INGOT: 3
    IRON_INGOT: 10
    GOLD_INGOT: 15
    LAPIS_LAZULI: 4
    REDSTONE: 2
    DIAMOND: 50
    EMERALD: 60
    NETHERITE_SCRAP: 150
    NETHERITE_INGOT: 650
    AMETHYST_SHARD: 3
    QUARTZ: 3
    BLAZE_ROD: 25
    ENDER_PEARL: 15
    COAL_BLOCK: 18
    IRON_BLOCK: 90
    GOLD_BLOCK: 135
    LAPIS_BLOCK: 36
    REDSTONE_BLOCK: 18
    DIAMOND_BLOCK: 450
    EMERALD_BLOCK: 540
    COPPER_BLOCK: 27
    WHEAT: 1
    BONE: 1
    GUNPOWDER: 2
    STRING: 1
    LEATHER: 2
    SLIME_BALL: 3

# ---------------------------------------------------------------------------------------------------------------
# Háború
# ---------------------------------------------------------------------------------------------------------------

invasions:
  # Az invázió ára NP-ben (masswar alatt ingyenes, lásd lent).
  cost: 50
  # Ennyi idő alatt kell legyőzni a bajnokot.
  time-seconds: 300
  # Ha az indító ennyi másodpercnél tovább nincs a környéken (vagy meghal), az invázió elbukik.
  leave-seconds: 20
  # Legalább ennyi védőnek fent kell lennie (0 = mindegy).
  min-online-defenders: 0
  cooldown-failed-seconds: 300
  cooldown-success-seconds: 0
  # Vesztes védőknek ennyi perc pajzs jár, hogy ne lehessen egymás után az összes földjüket elvenni.
  defeat-shield-minutes: 30
  # Zsákmány a győztesnek: a vesztes NP-jének és bankjának ennyied része.
  loot:
    land:
      resource-points: 0.05
      bank: 0.05
    nexus:
      resource-points: 0.30
      bank: 0.25
  champion:
    entity: ZOMBIE
    health: 100
    damage: 6
    speed: 0.25

# Pacifista királyságot nem lehet megtámadni és ellenségnek nyilvánítani, de ő sem támadhat.
pacifism:
  enabled: true
  cooldown-hours: 24
  # A pacifisták nem PvP-zhetnek (nem üthetnek és nem üthetők).
  disable-pvp: true

# Pajzsok: óra: NP ár. A pajzs alatt nem támadhatnak meg, de ha ti támadtok, eltűnik.
shields:
  6: 300
  12: 550
  24: 1000

# Masswar: interval-hours óránként minutes percig mindenki támadhat mindenkit (a semlegeseket is), ingyen.
masswar:
  enabled: true
  interval-hours: 24
  minutes: 60
  neutral-invade: true
  free-invasions: true

nations:
  # Alapítás ára a bankból.
  cost: 50000
  min-level: 3
  max-kingdoms: 8
  # A főváros pajzsa a nemzet minden tagját védi.
  shared-shield: true

# Kapcsolatok jogai. build: építhet a másik földjén | interact: ajtó, kapu, kapcsoló | home: mehet az otthonukba
# ceasefire: nem sebezhetik egymást | turret-ceasefire: a tornyok nem lőnek rá | invade: megtámadhatja
relations:
  limits:
    ally: 10
    truce: 10
  nation:
    color: "&b"
    name: "Nemzettárs"
    build: false
    interact: true
    home: true
    ceasefire: true
    turret-ceasefire: true
    invade: false
  ally:
    color: "&d"
    name: "Szövetséges"
    build: false
    interact: true
    home: true
    ceasefire: true
    turret-ceasefire: true
    invade: false
  truce:
    color: "&e"
    name: "Fegyverszünet"
    build: false
    interact: false
    home: false
    ceasefire: true
    turret-ceasefire: false
    invade: false
  neutral:
    color: "&f"
    name: "Semleges"
    build: false
    interact: false
    home: false
    ceasefire: false
    turret-ceasefire: false
    invade: false
  enemy:
    color: "&c"
    name: "Ellenség"
    build: false
    interact: false
    home: false
    ceasefire: false
    turret-ceasefire: false
    invade: true

turret-settings:
  # Földenként ennyi torony (+ a "Több torony" fejlesztés).
  per-land: 5
  # A tornyok a szörnyekre is lőnek.
  target-monsters: true
  # Lőszer: egy feltöltés ennyi lövés, lövésenként ennyi NP.
  ammo-per-refill: 64
  ammo-cost: 1

