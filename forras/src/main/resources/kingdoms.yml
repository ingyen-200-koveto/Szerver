# ---------------------------------------------------------------------------------------------------------------
# Építmények és tornyok. price: vételár NP | max-level | upgrade-cost: az első fejlesztés ára | upgrade-multiplier
# min-level: királysági szint | limit: ennyi lehet egy királyságnak (0 = korlátlan) | block: a lerakott blokk
# values: a fajta számai; "<kulcs>-per-level" szintenként ennyivel nő (vagy csökken, ha negatív)
# ---------------------------------------------------------------------------------------------------------------

# Lerakott építmények és tornyok fölötti felirat (név, szint, lőszer).
structure-labels: true

structures-settings:
  # Királyság alapításakor a király megkapja a Nexus tárgyat.
  give-nexus-on-create: true
  # Egy földre (chunkra) ennyi építmény rakható (a Nexus és a Szabályzó nem számít bele). 0 = nincs korlát.
  per-land: 1
  # Eladáskor (/k sell) a vételár és a fejlesztések árának ennyi %-át kapjátok vissza nexuspontban.
  sell-percent: 50

# Nexus lopás: ellenséges királyság tagja gyémánt kapával üti a Nexust, és elviszi a nexuspontok egy részét.
# A kapa elhasználódik. Pajzsos vagy pacifista királyságtól nem lehet lopni.
nexus-steal:
  enabled: true
  percent: 5
  # Legfeljebb ennyi NP egy lopással.
  max: 2000
  # Ugyanattól a királyságtól ennyi percenként lehet lopni.
  cooldown-minutes: 60
  # Legalább ennyi tagnak fent kell lennie a megtámadott királyságból.
  min-online: 1

# /k fly: repülés a saját földeteken (jogosultság: icemine.kingdoms.fly). Harc után ennyi másodpercig nem lehet repülni.
fly:
  combat-seconds: 10

