# Fyland (OneBlock)
# Mindenki kap egy saját szigetet a semmi közepén, ami egyetlen blokkból áll. Ha kibányászod, a helyén azonnal új
# blokk jelenik meg. A blokkok fázisokban jönnek (Síkság, Föld alatt, Tél, Óceán... egészen az Endig), néha láda
# vagy mob is. A fázis végén jutalom láda jár. Az utolsó fázis után újra az elsővel kezdődik (egy új körben).
#
# Parancs: /fyland (vagy /fy, /is). Játékos warpok: /pw, varázslatok: /enchanter, warp menü: /fywarp. Admin: /fy admin fazis <játékos> <fázis> | /fy admin torol <játékos> | /fy admin tp <játékos>
# A szigetek az IceMine adatbázisában vannak (SQLite vagy MySQL), a tárgyakat kilépéskor mentjük.

world: fyland
hub-built: false
# A szigetek pénzneme (economy.yml). Külön pénz, hogy a bányászat ne borítsa fel a PvP módokat.
currency: fyland

island:
  # Két sziget között ennyi blokk van (ne legyen kevesebb, mint a legnagyobb sziget méret kétszerese)
  spacing: 400
  # A varázsblokk magassága
  y: 100
  # Sziget szint: a szigetre rakott értékes blokkok (block-values) összértéke alapján, ennyi pontonként eggyel nő
  level-points: 100
  # A /fy szint (újraszámolás) között ennyi másodpercet kell várni
  recalc-cooldown-seconds: 300
  # A sziget újrakezdése között ennyi percet kell várni
  reset-cooldown-minutes: 60
  # Ha valaki ez alá esik, visszavisszük a szigetére (nem hal meg)
  void-y: 40
  # Halálkor megmaradnak a tárgyak
  keep-inventory: true

# Látogatás: ha true, csak olyan szigetre lehet átmenni, aminek van látogatási pontja (/fy setwarp).
visit:
  require-warp: true

# A sziget értéke: ezek a blokkok ennyi pontot érnek, ha a szigetre rakod őket (kiütéskor levonjuk).
# A sziget szintje = érték / island.level-points + 1. A /fy szint az egész szigetet újraszámolja.
block-values:
  IRON_BLOCK: 10
  GOLD_BLOCK: 15
  REDSTONE_BLOCK: 6
  LAPIS_BLOCK: 8
  COPPER_BLOCK: 4
  EMERALD_BLOCK: 40
  DIAMOND_BLOCK: 50
  NETHERITE_BLOCK: 300
  AMETHYST_BLOCK: 3
  QUARTZ_BLOCK: 3
  OBSIDIAN: 2
  CRYING_OBSIDIAN: 4
  BEACON: 500
  ENCHANTING_TABLE: 25
  ANVIL: 15
  CONDUIT: 200
  DRAGON_EGG: 2000
  SEA_LANTERN: 4
  END_ROD: 2
  PURPUR_BLOCK: 2
  PRISMARINE_BRICKS: 2
  DARK_PRISMARINE: 3
  SHULKER_BOX: 30
  HONEY_BLOCK: 5
  SLIME_BLOCK: 5
  BOOKSHELF: 3
  JUKEBOX: 10
  LODESTONE: 30
  RESPAWN_ANCHOR: 30
  ENDER_CHEST: 20

# Csatatér: PvP aréna a központ mellett (híd vezet oda). Csak itt lehet egymást ütni, és aki itt hal meg,
# annak leesnek a tárgyai (a szintje megmarad). /fy csatater vagy /fywarp
battlefield:
  enabled: true
  # Az aréna közepe és sugara (blokk). Az első induláskor felépül (built: true jelzi).
  x: 60
  z: 0
  radius: 22
  built: false

# Ellátmány láda a csatatéren: ennyi percenként érkezik, ha legalább min-players fő van a Fylandon.
# loot: "ANYAG min-max esély" (mint a fázis ládáknál), plusz ekkora eséllyel egy egyedi varázskönyv.
airdrop:
  enabled: true
  minutes: 20
  min-players: 2
  despawn-minutes: 5
  enchant-book-chance: 0.35
  loot:
    - "GOLDEN_APPLE 2-4 0.8"
    - "ENCHANTED_GOLDEN_APPLE 1 0.08"
    - "DIAMOND 2-6 0.6"
    - "EMERALD 3-8 0.5"
    - "NETHERITE_SCRAP 1-2 0.15"
    - "EXPERIENCE_BOTTLE 8-24 0.7"
    - "ENDER_PEARL 2-6 0.5"
    - "DIAMOND_SWORD 1 0.2"
    - "DIAMOND_CHESTPLATE 1 0.12"
    - "TOTEM_OF_UNDYING 1 0.05"
    - "IRON_BLOCK 2-6 0.4"

# Egyedi varázslatok (/enchanter). A könyvet XP szintért veszed, és a táskádban egy tárgyra húzod.
# success: a siker esélye (a könyvön véletlenszerű ezek között), destroy: ha nem sikerül, ekkora eséllyel tönkremegy a tárgy.
# applies: tool (csákány, fejsze, ásó, kapa), pickaxe, weapon (kard, fejsze), armor, boots, helmet
# A hatás a kódban van (az azonosító dönti el), a nevet, az árat és a max szintet itt lehet állítani.
enchanter:
  success:
    min: 40
    max: 100
  destroy:
    min: 0
    max: 30
  enchants:
    autoszmelt:
      name: "&6Autoszmelt"
      icon: FURNACE
      max-level: 1
      cost: [30]
      applies: tool
      description:
        - "&7A kibányászott érc és homok"
        - "&7egyből kiolvasztva esik le."
    telepatia:
      name: "&bTelepátia"
      icon: ENDER_EYE
      max-level: 1
      cost: [25]
      applies: tool
      description:
        - "&7Amit kibányászol, egyből"
        - "&7a táskádba kerül."
    tapasztalat:
      name: "&aTapasztalat"
      icon: EXPERIENCE_BOTTLE
      max-level: 3
      cost: [15, 25, 40]
      applies: tool
      description:
        - "&7Szintenként +50% XP"
        - "&7a bányászatból."
    robbano:
      name: "&cRobbanó"
      icon: TNT
      max-level: 3
      cost: [20, 35, 50]
      applies: pickaxe
      description:
        - "&7Szintenként 15% eséllyel a blokk körül"
        - "&7a többi is kitörik (3x3, a szigeteden)."
    vampir:
      name: "&4Vámpír"
      icon: REDSTONE
      max-level: 3
      cost: [20, 30, 45]
      applies: weapon
      description:
        - "&7Az ütésed egy része"
        - "&7visszagyógyít."
    mereg:
      name: "&2Méreg"
      icon: SPIDER_EYE
      max-level: 3
      cost: [15, 25, 40]
      applies: weapon
      description:
        - "&7Szintenként 12% eséllyel"
        - "&7megmérgezed, akit ütsz."
    gyorsasag:
      name: "&fGyorsaság"
      icon: SUGAR
      max-level: 2
      cost: [20, 40]
      applies: boots
      description:
        - "&7Gyorsabban futsz, amíg"
        - "&7rajtad van a csizma."
    ejjellatas:
      name: "&9Éjjellátás"
      icon: GOLDEN_CARROT
      max-level: 1
      cost: [20]
      applies: helmet
      description:
        - "&7Sötétben is látsz, amíg"
        - "&7rajtad van a sisak."

