# Scoreboard, tablista és chat
# Placeholderek: %player% %rank% (LuckPerms előtag) %rank_name% (LuckPerms csoport) %icecoin% (a weboldalas egyenleg) %money% %gens_money% %online% %max% %mode% %discord% %combat%
#   PvP módokban: %kills% %deaths% %kd% %streak% %best_streak%
#   Creative: %cr_plot% (a telek, ahol állsz) %cr_owner% %cr_plots% (telkeid/max)
#   Fyland: %fy_phase% %fy_progress% %fy_blocks% %fy_level% %fy_members% %fy_cycle% %fy_money% %fy_island%
#   ComboFly arénában még: %combo% (a mostani kombó), %combo_best% (rekord)
#   Bárhol: %combat_time% (combat hátralévő ideje, pl. 29.4s), %pearl% (enderpearl várakozás, pl. 4.4s)
#   Ha egy táblán ezek közül valamelyik szerepel, az a tábla másodpercenként 10-szer frissül.
#   Gens: %fields% %max_fields% %hoe% %harvested% %multiplier% %production% %plot% %earned% %prestige% %rebirth%
#   Bárhol: %online_<mód>% %status_<mód>% %parkour_record%
# Egy tábla legfeljebb 15 sor lehet.

title: "&b&l❄ &b&lIce&f&lMine&b&l ❄"
update-ticks: 20
# Táblánként külön cím (ha nincs megadva, a fenti title-t használja)
titles:
  combofly: "&bIce&fMine &f| 2.0"
# Ezeken a táblákon látszanak a jobb oldali piros számok
show-numbers: [combofly]
discord: "discord.gg/icemine"

boards:
  duels:
    - "&8&m                    "
    - "&7Mód: %duel_mode%"
    - "&7Ellenfél: &f%duel_opponent%"
    - ""
    - "&7Állás: &e%duel_score%"
    - "&7Ütések: &e%duel_hits%"
    - "&7Elo: &f%duel_elo%"
    - "&7Idő: &f%duel_time%"
    - ""
    - "&bplay.icemine.hu"
  # A játékmódok saját lobbyjában (lobby_fyland, lobby_gens...). Külön is megadhatod, pl. lobby_fyland:
  modelobby:
    - "&8&m                    "
    - "&7Játékos: &f%player%"
    - "&7Rang: %rank%"
    - "&7IceCoin: &b%icecoin%"
    - ""
    - "&7Hol vagy: %mode%"
    - "&7Online: &b%online%"
    - ""
    - "&eLépj be a portálba!"
    - "&bplay.icemine.hu"
  lobby:
    - "&8&m                    "
    - "&7Játékos: &f%player%"
    - "&7Rang: %rank%"
    - "&7IceCoin: &b%icecoin%"
    - ""
    - "&7Játékmód: &bLobby"
    - "&7Online: &b%online%"
    - ""
    - "&9%discord%"
    - "&bplay.icemine.hu"
  fyland:
    - "&8&m                    "
    - "&7Mód: &a&lFyland"
    - ""
    - "&7Fázis: %fy_phase%"
    - "&7Haladás: &f%fy_progress%"
    - "&7Kibányászva: &f%fy_blocks%"
    - "&7Szint: &f%fy_level% &8| &7Kör: &f%fy_cycle%"
    - "&7Csapat: &f%fy_members%"
    - ""
    - "&7Pénz: %fy_money%"
    - "&bplay.icemine.hu"
  creative:
    - "&8&m                    "
    - "&7Mód: &5&lCreative"
    - ""
    - "&7Telek: &f%cr_plot%"
    - "&7Tulaj: &f%cr_owner%"
    - "&7Telkeid: &f%cr_plots%"
    - ""
    - "&7Online: &b%online%"
    - "&bplay.icemine.hu"
  combofly:
    - "&7&m                         "
    - "&fÖlések: &6%kills%"
    - "&fHalálok: &6%deaths%"
    - "&fCombat: &c%combat_time%"
    - "&fEnderpearl: &e%pearl%"
    - "&7&m                         "
  gens:
    - "&8&m                    "
    - "&7Mód: &a&lGens"
    - ""
    - "&7Pénz: %gens_money%"
    - "&7Földek: &f%fields%&7/&f%max_fields%"
    - "&7Kapa: &f%hoe%"
    - "&7Learatva: &f%harvested%"
    - "&7Prestige: &d%prestige% &8| &7Rebirth: &5%rebirth%"
    - "&7Összes bevétel: &e%earned%"
    - ""
    - "&7Sziget: &f%plot%"
    - "&bplay.icemine.hu"
  default:
    - "&8&m                    "
    - "&7Játékos: &f%player%"
    - "&7Mód: %mode%"
    - "&7Online: &b%online%"
    - ""
    - "&bplay.icemine.hu"

# Tablista (Tab gomb). Ha a TAB plugin fent van, az IceMine rajta keresztül írja ki ezt (a TAB saját fejléce,
# lábléce és ping számai így nem látszanak), a nevek elé a rang kerül, és a magasabb rang van feljebb.
tablist:
  header:
    - ""
    - "&b&l❄ &b&lIce&f&lMine &b&l❄"
    - ""
    - "&7Üdv, &f%player%&7!"
    - "&7Online: &b%online% &8• &7Itt vagy: %mode%"
    - ""
  footer:
    - ""
    - "&7Rang: %rank% &8• &7IceCoin: &b%icecoin%"
    - ""
    - "&9%discord% &8• &fwww.icemine.hu"
    - "&bplay.icemine.hu"
    - ""

chat:
  enabled: true
  # %prefix% és %suffix% = LuckPerms előtag és utótag, %name% = játékosnév, %message% = üzenet
  format: "%prefix%%name%&8: %chatcolor%%message%"
