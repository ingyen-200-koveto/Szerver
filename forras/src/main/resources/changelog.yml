# IceMine changelog. A nagyobb frissítések (x.y.0) a szerver első indulásakor a Discordra kerülnek.
# Kisebb javításnál (x.y.1, x.y.2...) nem megy üzenet, csak ha "nagy: true".
# cim: rövid cím, pontok: az újdonságok, úgy, ahogy egy játékos megérti.

"3.60.0":
  cim: "Közös farm a Gensben"
  pontok:
    - "A földek a Gens központjába kerültek, mindenki ott arat."
    - "A legjobb kapa is legfeljebb 5x5-öt arat egyszerre."
    - "A lobbyban az üzenetek előtt Lobby • áll."

