# Gens
# Mindenki saját farm szigetet kap 8 földdel. A növényeket a Gens kapával kell learatni (bal klikk), a termést
# eladod (hordó a sziget közepén, /elad vagy a menü), a pénzből új földeket nyitsz és a kapát fejleszted.
# Learatás után a növény magától visszanő. A Gens saját pénzt használ (economy.yml: gens), így a PvP nem borítja fel.

world: ice_gens
hub-built: false
time: 6000
void-y: 60

plot:
  # A szigetek távolsága egymástól (blokk)
  spacing: 96
  # Ekkora területen lehet építeni a sziget közepétől (legalább 26, ekkora maga a farm)
  build-radius: 40
  height: 100

currency: gens

daily:
  amount: 500

# A földek, ebben a sorrendben nyílnak meg a Gens szinttel (az első mindenkinek jár). Legfeljebb 8.
# crop: wheat, carrots, potatoes, beetroots, melon, pumpkin, sweet_berry_bush, nether_wart
# value: ennyit ér egy termény | regrow: ennyi mp alatt nő vissza | level: ettől a Gens szinttől nyílik meg
# multiplier: ennyi termény jár egy növényért (a tört rész eséllyel, pl. 1.5 = fele eséllyel 2)
fields:
  1:
    name: "Búza"
    crop: wheat
    value: 2
    regrow: 5
    level: 1
    multiplier: 1.0
  2:
    name: "Sárgarépa"
    crop: carrots
    value: 5
    regrow: 6
    level: 3
    multiplier: 1.1
  3:
    name: "Krumpli"
    crop: potatoes
    value: 11
    regrow: 7
    level: 6
    multiplier: 1.2
  4:
    name: "Cékla"
    crop: beetroots
    value: 25
    regrow: 8
    level: 10
    multiplier: 1.35
  5:
    name: "Dinnye"
    crop: melon
    value: 55
    regrow: 10
    level: 15
    multiplier: 1.5
  6:
    name: "Tök"
    crop: pumpkin
    value: 120
    regrow: 12
    level: 22
    multiplier: 1.7
  7:
    name: "Bogyó"
    crop: sweet_berry_bush
    value: 260
    regrow: 14
    level: 30
    multiplier: 1.9
  8:
    name: "Netherbibircsók"
    crop: nether_wart
    value: 600
    regrow: 16
    level: 40
    multiplier: 2.2

# A Gens kapa fejlesztései (jobb klikk a kapával, az üllő a sziget közepén, vagy /gens kapa).
# price: az első szint ára | price-multiplier: minden szint ennyiszer drágább | per-level: ennyit ad szintenként
# boseg: +% esély egy extra termésre | kaszalas: 1 = 3x3, 2 = 5x5 (max 2, nagyobb területet egyszerre nem lehet)
# aranykez: +% eladási ár | szerencse: +% esély, hogy aratáskor pénzt találsz (a termény ára × luck-multiplier)
# tiers: ennyi összes fejlesztési szinttől lesz a kapa fa, kő, vas, arany, gyémánt, netherit
hoe:
  tiers: [0, 5, 15, 28, 42, 55]
  luck-multiplier: 10
  enchants:
    boseg:
      name: "&a&lBőség"
      icon: WHEAT
      max: 25
      price: 750
      price-multiplier: 1.42
      per-level: 10
      description:
        - "&7Szintenként +10% esély"
        - "&7egy extra termésre."
    kaszalas:
      name: "&e&lKaszálás"
      icon: SHEARS
      max: 2
      price: 25000
      price-multiplier: 10
      per-level: 1
      description:
        - "&7Egyszerre több növényt aratsz:"
        - "&73x3, utána 5x5."
    aranykez:
      name: "&6&lAranykéz"
      icon: GOLD_INGOT
      max: 20
      price: 1500
      price-multiplier: 1.45
      per-level: 5
      description:
        - "&7Szintenként +5% pénz"
        - "&7minden eladott terményért."
    szerencse:
      name: "&d&lSzerencse"
      icon: RABBIT_FOOT
      max: 10
      price: 10000
      price-multiplier: 1.6
      per-level: 0.5
      description:
        - "&7Szintenként +0,5% esély, hogy aratáskor"
        - "&7pénzt találsz a földben."

# Sziget fejlesztések (a menüben). effect: capacity (+% esély extra termésre), speed (-% visszanövési idő), value (+% eladási ár)
# per-level: ennyi százalék szintenként | prices: szintenként az ár (ahány ár, annyi szint)
# Ezek a szigethez tartoznak: a tagjaid is élvezik, amikor nálad aratnak.
island-upgrades:
  tarolo:
    name: "&a&lTermékeny föld"
    icon: BONE_MEAL
    effect: capacity
    per-level: 10
    prices: [5000, 20000, 75000, 250000, 800000]
    description:
      - "&7+10% esély egy extra termésre"
      - "&7szintenként, a szigeted minden földjén."
  sebesseg:
    name: "&b&lGyorsabb növekedés"
    icon: CLOCK
    effect: speed
    per-level: 8
    prices: [6000, 25000, 90000, 300000, 900000]
    description:
      - "&7-8% visszanövési idő szintenként."
  ertek:
    name: "&e&lJobb ár"
    icon: GOLD_NUGGET
    effect: value
    per-level: 6
    prices: [5000, 20000, 75000, 250000, 750000]
    description:
      - "&7+6% pénz minden eladásnál szintenként."

# Prestige: ha megvan required-level darab föld (0 = mind), pénzért újrakezdheted.
# A Gens pénz elvész, a földek újra lezárulnak (csak a búza marad), a kapa megmarad.
# Cserébe minden prestige után tartósan több termény jár egy növényért (bonus % / prestige).
# Az ár minden prestige után a price-multiplier szorosára nő.
prestige:
  max: 10
  required-level: 0
  price: 25000000
  price-multiplier: 1.4
  bonus: 15

# Rebirth: ha megvan a required-prestige, még nagyobb újrakezdés: a prestige, a kapa és a sziget fejlesztések
# is nullázódnak, de nagy bónusz jár (bonus % / rebirth). max: 0 = nincs felső határ.
rebirth:
  required-prestige: 10
  price: 500000000
  price-multiplier: 2.5
  bonus: 75
  max: 0

# Automatikus eladás: a learatott termést rögtön eladja (10 mp-enként jön meg a pénz).
# Megvásárolható, vagy a rang adja (icemine.gens.autosell). rate: a teljes ár hányad része (1.0 = teljes ár).
autosell:
  price: 250000
  rate: 1.0

# Hátizsák (/gens backpack): ide megy a termés, ha tele a táskád, és a "Mindent elad" ezt is eladja.
# A nagy hátizsák megvásárolható, vagy a rang adja (icemine.gens.backpack.large).
backpack:
  size: 27
  large-size: 54
  large-price: 150000

# Elixír: aratáskor jár, a learatott termés értékének ennyi része. Ebből fejleszted a kapát (a kapa árai elixírben vannak).
elixir:
  rate: 1.0

# Gens szint: aratásért (xp-per-crop × a föld sorszámával nő) és a generátor dropok eladásáért jár XP.
# Egy szinthez base × growth^(szint-1) XP kell. Szintlépéskor reward-money × szint pénz és reward-elixir × szint elixír jár,
# minden booster-every. szinten egy 2x booster (30 perc), minden slots-every. szinten egy +5 generátor férőhely.
level:
  xp-per-crop: 2
  base: 150
  growth: 1.17
  max: 100
  reward-money: 500
  reward-elixir: 200
  booster-every: 5
  slots-every: 10

# Generátorok (mint a FyreMC Gens Tycoonban): a Generátor boltban (/gens generator, vagy a Gens menü) veszed,
# a szigeteden lerakod, és magától termel. A termést eltárolja (capacity + capacity-per-tier × (szint-1) darabig),
# jobb klikk: begyűjtés / eladás / fejlesztés, guggolva jobb klikk: begyűjtés. Ha be van kapcsolva az automatikus
# eladás, a dropok rögtön pénzzé válnak. Csak akkor termelnek, ha a sziget gazdája fent van.
# Egy szigeten base-slots generátor lehet, a +5 férőhely jeggyel max-slots-ig bővíthető (slot-price, minden vétel után drágább).
# Fejlesztés ára: a következő szint ára mínusz a mostani árának upgrade-refund része.
# tiers: name, block (a lerakott blokk), drop, drop-name, value (egy drop ára), seconds (ennyi mp alatt 1 drop),
# price (ár a boltban), level (szükséges Gens szint)
generators:
  base-slots: 5
  max-slots: 50
  capacity: 64
  capacity-per-tier: 32
  slot-price: 250000
  upgrade-refund: 0.5
  tiers:
    1: {name: "Szén generátor", block: COAL_BLOCK, drop: COAL, drop-name: "Szén drop", value: 4, seconds: 5, price: 2000, level: 1}
    2: {name: "Vas generátor", block: IRON_BLOCK, drop: IRON_INGOT, drop-name: "Vas drop", value: 10, seconds: 5, price: 15000, level: 3}
    3: {name: "Arany generátor", block: GOLD_BLOCK, drop: GOLD_INGOT, drop-name: "Arany drop", value: 25, seconds: 5, price: 75000, level: 6}
    4: {name: "Lazurit generátor", block: LAPIS_BLOCK, drop: LAPIS_LAZULI, drop-name: "Lazurit drop", value: 55, seconds: 5, price: 300000, level: 10}
    5: {name: "Vöröskő generátor", block: REDSTONE_BLOCK, drop: REDSTONE, drop-name: "Vöröskő drop", value: 110, seconds: 5, price: 1200000, level: 14}
    6: {name: "Mézblokk generátor", block: HONEYCOMB_BLOCK, drop: HONEYCOMB, drop-name: "Lép drop", value: 220, seconds: 5, price: 4000000, level: 18}
    7: {name: "Tengeri lámpás generátor", block: SEA_LANTERN, drop: PRISMARINE_CRYSTALS, drop-name: "Prizmarin kristály drop", value: 450, seconds: 5, price: 12000000, level: 22}
    8: {name: "Smaragd generátor", block: EMERALD_BLOCK, drop: EMERALD, drop-name: "Smaragd drop", value: 900, seconds: 5, price: 35000000, level: 27}
    9: {name: "Gyémánt generátor", block: DIAMOND_BLOCK, drop: DIAMOND, drop-name: "Gyémánt drop", value: 1800, seconds: 5, price: 100000000, level: 32}
    10: {name: "Ametiszt generátor", block: AMETHYST_BLOCK, drop: AMETHYST_SHARD, drop-name: "Ametiszt drop", value: 3600, seconds: 5, price: 300000000, level: 38}
    11: {name: "Réz generátor", block: COPPER_BLOCK, drop: COPPER_INGOT, drop-name: "Rézrúd drop", value: 7000, seconds: 5, price: 800000000, level: 45}
    12: {name: "Kvarc generátor", block: QUARTZ_BLOCK, drop: QUARTZ, drop-name: "Kvarc drop", value: 14000, seconds: 5, price: 2000000000, level: 52}
    13: {name: "Netherit generátor", block: NETHERITE_BLOCK, drop: NETHERITE_SCRAP, drop-name: "Netherit drop", value: 28000, seconds: 5, price: 6000000000, level: 60}

# Eventek: interval-minutes percenként egy véletlen event (a Gens világban bossbar mutatja, mikor jön a következő).
# type: gen-speed (gyorsabb generátor), gen-drop (több drop), elixir, money (eladás), xp. Admin: /gens event <id|random>
events:
  interval-minutes: 45
  list:
    dupla-drop: {name: "&b&l2x Generátor Drop event", type: gen-drop, multiplier: 2, minutes: 10}
    gyors-gen: {name: "&d&l150% Felgyorsult Generátor event", type: gen-speed, multiplier: 1.5, minutes: 10}
    elixir: {name: "&5&l2x Elixír event", type: elixir, multiplier: 2, minutes: 10}
    penz: {name: "&e&l+50% Eladás event", type: money, multiplier: 1.5, minutes: 10}
    xp: {name: "&a&l2x Szint XP event", type: xp, multiplier: 2, minutes: 10}

# Egyéb eladható tárgyak (ANYAG: ár). A földek terményeinek árát a fields résznél állítod.
sell-prices: {}

quests:
  per-day: 3
  # type: harvest (aratás) | sell_items (eladás) | upgrade (kapa vagy sziget fejlesztés) | earn (pénz) | unlock (új föld)
  pool:
    arat200:
      name: "Arass le 200 növényt"
      type: harvest
      amount: 200
      reward: 300
    arat1000:
      name: "Arass le 1 000 növényt"
      type: harvest
      amount: 1000
      reward: 1200
    elad500:
      name: "Adj el 500 terményt"
      type: sell_items
      amount: 500
      reward: 600
    fejleszt2:
      name: "Fejleszd kétszer a kapádat vagy a szigeted"
      type: upgrade
      amount: 2
      reward: 800
    keres5000:
      name: "Keress 5 000 érmét"
      type: earn
      amount: 5000
      reward: 1000
    nyit1:
      name: "Nyiss meg egy új földet"
      type: unlock
      amount: 1
      reward: 1500

