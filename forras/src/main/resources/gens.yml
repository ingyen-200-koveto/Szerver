    block: GOLD_BLOCK
    drop: GOLD_INGOT
    value: 12
    interval: 6
    amount: 1
    capacity: 96
    upgrade: 2000
  4:
    name: "Lápisz"
    block: LAPIS_BLOCK
    drop: LAPIS_LAZULI
    value: 25
    interval: 6
    amount: 1
    capacity: 96
    upgrade: 5000
  5:
    name: "Redstone"
    block: REDSTONE_BLOCK
    drop: REDSTONE
    value: 45
    interval: 6
    amount: 1
    capacity: 128
    upgrade: 12000
  6:
    name: "Gyémánt"
    block: DIAMOND_BLOCK
    drop: DIAMOND
    value: 90
    interval: 6
    amount: 1
    capacity: 128
    upgrade: 30000
  7:
    name: "Smaragd"
    block: EMERALD_BLOCK
    drop: EMERALD
    value: 180
    interval: 6
