# Gens
# Mindenki saját farm szigetet kap 8 földdel. A növényeket a Gens kapával kell learatni (bal klikk), a termést
# eladod (hordó a sziget közepén, /elad vagy a menü), a pénzből új földeket nyitsz és a kapát fejleszted.
# Learatás után a növény magától visszanő. A Gens saját pénzt használ (economy.yml: gens), így a PvP nem borítja fel.

world: ice_gens
hub-built: false
time: 6000
void-y: 60

plot:
  # A szigetek távolsága egymástól (blokk)
  spacing: 96
  # Ekkora területen lehet építeni a sziget közepétől (legalább 26, ekkora maga a farm)
  build-radius: 40
  height: 100

currency: gens

daily:
  amount: 500

# A földek, ebben a sorrendben lehet őket megnyitni (az első ingyen jár). Legfeljebb 8.
# crop: wheat, carrots, potatoes, beetroots, melon, pumpkin, sweet_berry_bush, nether_wart
# value: ennyit ér egy termény | regrow: ennyi mp alatt nő vissza | price: ennyibe kerül megnyitni
# multiplier: ennyi termény jár egy növényért (a tört rész eséllyel, pl. 1.5 = fele eséllyel 2)
fields:
  1:
    name: "Búza"
    crop: wheat
    value: 2
    regrow: 5
    price: 0
    multiplier: 1.0
  2:
    name: "Sárgarépa"
    crop: carrots
    value: 5
    regrow: 6
    price: 2500
    multiplier: 1.1
  3:
    name: "Krumpli"
    crop: potatoes
    value: 11
    regrow: 7
    price: 15000
    multiplier: 1.2
  4:
    name: "Cékla"
    crop: beetroots
    value: 25
    regrow: 8
    price: 80000
    multiplier: 1.35
  5:
    name: "Dinnye"
    crop: melon
    value: 55
    regrow: 10
    price: 350000
    multiplier: 1.5
  6:
    name: "Tök"
    crop: pumpkin
    value: 120
    regrow: 12
    price: 1500000
    multiplier: 1.7
  7:
    name: "Bogyó"
    crop: sweet_berry_bush
    value: 260
    regrow: 14
    price: 6000000
    multiplier: 1.9
  8:
    name: "Netherbibircsók"
    crop: nether_wart
    value: 600
    regrow: 16
    price: 25000000
    multiplier: 2.2

# A Gens kapa fejlesztései (jobb klikk a kapával, az üllő a sziget közepén, vagy /gens kapa).
# price: az első szint ára | price-multiplier: minden szint ennyiszer drágább | per-level: ennyit ad szintenként
# boseg: +% esély egy extra termésre | kaszalas: 1 = 3x3, 2 = 5x5, 3 = az egész föld egyszerre (max 3)
# aranykez: +% eladási ár | szerencse: +% esély, hogy aratáskor pénzt találsz (a termény ára × luck-multiplier)
# tiers: ennyi összes fejlesztési szinttől lesz a kapa fa, kő, vas, arany, gyémánt, netherit
hoe:
  tiers: [0, 5, 15, 28, 42, 55]
  luck-multiplier: 10
  enchants:
    boseg:
      name: "&a&lBőség"
      icon: WHEAT
      max: 25
      price: 750
      price-multiplier: 1.42
      per-level: 10
      description:
        - "&7Szintenként +10% esély"
        - "&7egy extra termésre."
    kaszalas:
      name: "&e&lKaszálás"
      icon: SHEARS
      max: 3
      price: 25000
      price-multiplier: 10
      per-level: 1
      description:
        - "&7Egyszerre több növényt aratsz:"
        - "&73x3, utána 5x5, végül az egész földet."
    aranykez:
      name: "&6&lAranykéz"
      icon: GOLD_INGOT
      max: 20
      price: 1500
      price-multiplier: 1.45
      per-level: 5
      description:
        - "&7Szintenként +5% pénz"
        - "&7minden eladott terményért."
    szerencse:
      name: "&d&lSzerencse"
      icon: RABBIT_FOOT
      max: 10
      price: 10000
      price-multiplier: 1.6
      per-level: 0.5
      description:
        - "&7Szintenként +0,5% esély, hogy aratáskor"
        - "&7pénzt találsz a földben."

# Sziget fejlesztések (a menüben). effect: capacity (+% esély extra termésre), speed (-% visszanövési idő), value (+% eladási ár)
# per-level: ennyi százalék szintenként | prices: szintenként az ár (ahány ár, annyi szint)
# Ezek a szigethez tartoznak: a tagjaid is élvezik, amikor nálad aratnak.
island-upgrades:
  tarolo:
    name: "&a&lTermékeny föld"
    icon: BONE_MEAL
    effect: capacity
    per-level: 10
    prices: [5000, 20000, 75000, 250000, 800000]
    description:
      - "&7+10% esély egy extra termésre"
      - "&7szintenként, a szigeted minden földjén."
  sebesseg:
    name: "&b&lGyorsabb növekedés"
    icon: CLOCK
    effect: speed
    per-level: 8
    prices: [6000, 25000, 90000, 300000, 900000]
    description:
      - "&7-8% visszanövési idő szintenként."
  ertek:
    name: "&e&lJobb ár"
    icon: GOLD_NUGGET
    effect: value
    per-level: 6
    prices: [5000, 20000, 75000, 250000, 750000]
    description:
      - "&7+6% pénz minden eladásnál szintenként."

# Prestige: ha megvan required-level darab föld (0 = mind), pénzért újrakezdheted.
# A Gens pénz elvész, a földek újra lezárulnak (csak a búza marad), a kapa megmarad.
# Cserébe minden prestige után tartósan több termény jár egy növényért (bonus % / prestige).
# Az ár minden prestige után a price-multiplier szorosára nő.
prestige:
  max: 10
  required-level: 0
  price: 25000000
  price-multiplier: 1.4
  bonus: 15

# Rebirth: ha megvan a required-prestige, még nagyobb újrakezdés: a prestige, a kapa és a sziget fejlesztések
# is nullázódnak, de nagy bónusz jár (bonus % / rebirth). max: 0 = nincs felső határ.
rebirth:
  required-prestige: 10
  price: 500000000
  price-multiplier: 2.5
  bonus: 75
  max: 0

# Automatikus eladás: a learatott termést rögtön eladja (10 mp-enként jön meg a pénz).
# Megvásárolható, vagy a rang adja (icemine.gens.autosell). rate: a teljes ár hányad része (1.0 = teljes ár).
autosell:
  price: 250000
  rate: 1.0

# Hátizsák (/gens backpack): ide megy a termés, ha tele a táskád, és a "Mindent elad" ezt is eladja.
# A nagy hátizsák megvásárolható, vagy a rang adja (icemine.gens.backpack.large).
backpack:
  size: 27
  large-size: 54
  large-price: 150000

# Egyéb eladható tárgyak (ANYAG: ár). A földek terményeinek árát a fields résznél állítod.
sell-prices: {}

quests:
  per-day: 3
  # type: harvest (aratás) | sell_items (eladás) | upgrade (kapa vagy sziget fejlesztés) | earn (pénz) | unlock (új föld)
  pool:
    arat200:
      name: "Arass le 200 növényt"
      type: harvest
      amount: 200
      reward: 300
    arat1000:
      name: "Arass le 1 000 növényt"
      type: harvest
      amount: 1000
      reward: 1200
    elad500:
      name: "Adj el 500 terményt"
      type: sell_items
      amount: 500
      reward: 600
    fejleszt2:
      name: "Fejleszd kétszer a kapádat vagy a szigeted"
      type: upgrade
      amount: 2
      reward: 800
    keres5000:
      name: "Keress 5 000 érmét"
      type: earn
      amount: 5000
      reward: 1000
    nyit1:
      name: "Nyiss meg egy új földet"
      type: unlock
      amount: 1
      reward: 1500

