    amount: 1
    capacity: 192
    upgrade: 400000
  10:
    name: "Netherit"
    block: NETHERITE_BLOCK
    drop: NETHERITE_SCRAP
    value: 1200
    interval: 6
    amount: 1
    capacity: 192
    upgrade: 0

# Egyéb eladható tárgyak (ANYAG: ár)
