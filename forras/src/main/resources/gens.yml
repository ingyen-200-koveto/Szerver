    capacity: 128
    upgrade: 12000
  6:
    name: "Gyémánt"
    block: DIAMOND_BLOCK
    drop: DIAMOND
    value: 90
    interval: 6
    amount: 1
    capacity: 128
    upgrade: 30000
  7:
    name: "Smaragd"
