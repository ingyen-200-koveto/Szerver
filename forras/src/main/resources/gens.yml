# Gens
# Mindenki saját szigetet kap, generátorokat rak le, a termést eladja, és fejleszt.
# A Gens saját pénzt használ (economy.yml: gens), így a PvP nem borítja fel.
# A generátorok csak akkor termelnek, ha a tulajdonos fent van.

world: ice_gens
hub-built: false
time: 6000
void-y: 60

plot:
  # A szigetek távolsága egymástól (blokk)
  spacing: 96
  # Ekkora területen lehet építeni a sziget közepétől
  build-radius: 40
  height: 100

currency: gens
generator-price: 300
starter-generators: 2

daily:
  amount: 500

# Sziget szintek: több hely és nagyobb termelés
levels:
  1:
    slots: 6
    multiplier: 1.0
    price: 0
  2:
    slots: 9
    multiplier: 1.1
    price: 5000
  3:
    slots: 12
    multiplier: 1.25
    price: 25000
  4:
    slots: 16
    multiplier: 1.4
    price: 100000
  5:
    slots: 20
    multiplier: 1.6
    price: 400000
  6:
    slots: 25
    multiplier: 1.8
    price: 1500000

# Generátor szintek
# value: ennyit ér egy termék | interval: ennyi mp-enként termel | amount: ennyit termel egyszerre
# capacity: ennyi fér el benne (jobb klikkel gyűjtöd be) | upgrade: ennyibe kerül a következő szint
tiers:
  1:
    name: "Szén"
    block: COAL_BLOCK
    drop: COAL
    value: 2
    interval: 6
    amount: 1
    capacity: 64
    upgrade: 250
  2:
