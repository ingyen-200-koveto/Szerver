center:
  x: 0
  y: 100
  z: 0
time: 6000
void-y: 70
hunger: false
# Mennyit gyógyuljon a gyilkos egy ölés után (fél szívekben)
heal-on-kill: 6
# KitPvP-ben a kit tárgyak sosem esnek le
drop-loot: false

