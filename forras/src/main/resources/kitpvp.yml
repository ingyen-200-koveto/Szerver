# Fejlesztések: kristályért vehetők, minden kitre érvényesek.
# effect: sharpness (+élesség a fegyveren), protection (+védelem a páncélon), health (+fél szív),
#         cooldown (-% képesség újratöltés), reward (+% pénz ölésért)
# per-level: ennyit ad szintenként. prices: szintenként az ár (ahány ár, annyi szint).
upgrades:
  elesseg:
    name: "&c&lÉlesség"
    icon: IRON_SWORD
    effect: sharpness
    per-level: 1
    prices: [500, 1500, 4000]
    description:
      - "&7+1 Élesség szintenként"
      - "&7a kardodon és a baltádon."
  vedelem:
    name: "&9&lVédelem"
    icon: IRON_CHESTPLATE
    effect: protection
    per-level: 1
    prices: [600, 1800, 5000]
    description:
      - "&7+1 Védelem szintenként"
      - "&7minden páncéldarabodon."
  elet:
    name: "&4&lExtra élet"
    icon: GOLDEN_APPLE
    effect: health
    per-level: 2
    prices: [800, 2500, 6000]
    description:
      - "&7+1 szív szintenként."
  ujratoltes:
    name: "&b&lGyorsabb képesség"
    icon: CLOCK
    effect: cooldown
    per-level: 10
    prices: [400, 1200, 3000]
    description:
      - "&7-10% képesség újratöltés szintenként."
  kincs:
    name: "&6&lKincsvadász"
    icon: GOLD_INGOT
    effect: reward
    per-level: 10
    prices: [700, 2000, 5000]
    description:
      - "&7+10% pénz ölésért szintenként."

rewards:
  currency: kristaly
  kill: 10
  # Sorozat bónusz (pontosan ennyi ölésnél jár)
  streak-bonus:
    3: 10
    5: 25
    10: 60
    15: 100
    20: 150
  # Ugyanazért az áldozatért ennyi ideig nem jár újra pénz (farmolás ellen)
  same-victim-cooldown-seconds: 300
  # Azonos IP-ről érkező játékosok egymás megöléséért nem jár pénz (alt fiókok ellen)
  same-ip-rewards: false
  # Napi maximum, amit ebben a módban ölésből lehet keresni
  daily-cap: 2000

# Ezeknél a sorozatoknál mindenki látja a módban
broadcast-streaks: [5, 10, 15, 20, 25, 30]

# Sorozat jutalom tárgyak
streak-items:
  3:
    - "GOLDEN_APPLE 1"
  7:
    - "GOLDEN_APPLE 2"

# Ezt a plugin írja, ne töröld
migrated:
  flat-v1: true
