# KitPvP
# Az arénát (Jégmező: lapos, havas pálya, közepén kiemelt, védett lobbyval) az első indításkor
# a plugin építi fel ebben a világban. A lobbyból leugrasz a pályára, visszamenni nem lehet.
# A pálya szélén barrier fal van, hogy senki ne essen le.
# Újraépítés: /icemine rebuild kitpvp confirm
# Tárgy formátum: ANYAG [darab] [varázslat:szint ...] [unbreakable] [name=Név_aláhúzással]
# Bőrpáncél színe: #RRGGBB (pl. "LEATHER_CHESTPLATE 1 #1E1E1E")
# Bájital: effect=effekt:szint[:másodperc] (pl. "SPLASH_POTION 1 effect=instant_damage:1")
# Effekt formátum: effekt:szint (pl. speed:1)
# Ütéskori effekt: effekt:szint:másodperc:esély (pl. slowness:1:2:0.2 = 20% eséllyel 2 mp lassítás)

world: ice_kitpvp
