# Külön lobby világ minden játékmódhoz
# Ha valaki a főlobbyban kiválaszt egy módot (iránytű, szobor), először a mód saját lobbyjába kerül.
# Onnan a portálba lépve, a "Játék" hologramra vagy a hotbar első tárgyára kattintva jut be a játékba.
# A világot és a lobbyt az első indításkor a plugin építi fel, és ide beírja a pontokat.
#
# world: a lobby világ neve | color: a téma színe (red, light_blue, purple, lime, yellow, orange...)
# title: a lebegő felirat (A-Z betűk) | title-split: ennyi betű lesz színes, a többi fehér (0 = mind)
# theme: a lobby témája: kitpvp (gladiátor aréna), skypvp (felhők fölött), combofly (ametiszt kristályok),
#        gens (farm és bánya), kingdoms (vár udvar), duels (párbaj csarnok), snow (havas sziget)
# play-command: ha meg van adva, a portál ezt a parancsot futtatja a játékos nevében (pl. Bedwars)
# holograms: a "Játék" (play), az "Infó" és a toplisták (toplist: a config.yml toplista neve)
#   action: mit csináljon kattintásra (play | info:<szöveg> | menu:<menü> | command:<parancs> | mode:<mód>)
# Újraépítés: /icemine rebuild lobby_<mód> confirm | spawn áthelyezése: /icemine setspawn lobby_<mód>

enabled: true

lobbies:
  kitpvp:
    world: lobby_kitpvp
    theme: kitpvp
    built: false
    color: red
    title: "KITPVP"
    title-split: 3
    center: {x: 0, y: 100, z: 0}
    holograms:
      play:
        lines: ["&a&lJÁTÉK", "&7Kattints rám, vagy lépj", "&7be a portálba!"]
        action: play
      info:
        lines: ["&e&lHogyan játszd?", "&7Kattints rám!"]
        action: "info:mode_kitpvp"
      top1:
        toplist: kitpvp
        lines: []
      top2:
        toplist: streak
        lines: []
