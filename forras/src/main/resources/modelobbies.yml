# Külön lobby világ minden játékmódhoz
# Ha valaki a főlobbyban kiválaszt egy módot (iránytű, szobor), először a mód saját lobbyjába kerül.
# Onnan a portálba lépve, a "Játék" hologramra vagy a hotbar első tárgyára kattintva jut be a játékba.
# A világot és a lobbyt az első indításkor a plugin építi fel, és ide beírja a pontokat.
#
# world: a lobby világ neve | color: a téma színe (red, light_blue, purple, lime, yellow, orange...)
# title: a lebegő felirat (A-Z betűk) | title-split: ennyi betű lesz színes, a többi fehér (0 = mind)
# theme: a lobby témája: fullpvp (gladiátor aréna), fyland (felhők fölötti szigetek), combofly (ametiszt kristályok),
#        gens (farm és bánya), kingdoms (vár udvar), duels (párbaj csarnok), snow (havas sziget)
# play-command: ha meg van adva, a portál ezt a parancsot futtatja a játékos nevében (pl. Bedwars)
# holograms: a "Játék" (play), az "Infó" és a toplisták (toplist: a config.yml toplista neve)
#   action: mit csináljon kattintásra (play | info:<szöveg> | menu:<menü> | command:<parancs> | mode:<mód>)
# Újraépítés: /icemine rebuild lobby_<mód> confirm | spawn áthelyezése: /icemine setspawn lobby_<mód>

enabled: true

lobbies:
  fullpvp:
    world: lobby_fullpvp
    theme: fullpvp
    built: false
    color: red
    title: "FULLPVP"
    title-split: 4
    center: {x: 0, y: 100, z: 0}
    holograms:
      play:
        lines: ["&a&lJÁTÉK", "&7Kattints rám, vagy lépj", "&7be a portálba!"]
        action: play
      info:
        lines: ["&e&lHogyan játszd?", "&7Kattints rám!"]
        action: "info:mode_fullpvp"
      top1:
        toplist: fullpvp
        lines: []
      top2:
        toplist: streak
        lines: []
  fyland:
    world: lobby_fyland
    theme: fyland
    built: false
    color: lime
    title: "FYLAND"
    title-split: 2
    center: {x: 0, y: 100, z: 0}
    holograms:
      play:
        lines: ["&a&lJÁTÉK", "&7Kattints rám, vagy lépj", "&7be a portálba!"]
        action: play
      info:
        lines: ["&e&lHogyan játszd?", "&7Kattints rám!"]
        action: "info:mode_fyland"
      top1:
        toplist: fyland
        lines: []
  combofly:
    world: lobby_combofly
    theme: combofly
    built: false
    color: purple
    title: "COMBOFLY"
    title-split: 5
    center: {x: 0, y: 100, z: 0}
    holograms:
      play:
        lines: ["&a&lJÁTÉK", "&7Kattints rám, vagy lépj", "&7be a portálba!"]
        action: play
      info:
        lines: ["&e&lHogyan játszd?", "&7Kattints rám!"]
        action: "info:mode_combofly"
      top1:
        toplist: combokills
        lines: []
      top2:
        toplist: combo
        lines: []
  gens:
    world: lobby_gens
    theme: gens
    built: false
    color: lime
    title: "GENS"
    title-split: 0
    center: {x: 0, y: 100, z: 0}
    holograms:
      play:
        lines: ["&a&lJÁTÉK", "&7Kattints rám, vagy lépj", "&7be a portálba!"]
        action: play
      info:
        lines: ["&e&lHogyan játszd?", "&7Kattints rám!"]
        action: "info:mode_gens"
      top1:
        toplist: gens
        lines: []
  kingdoms:
    world: lobby_kingdoms
    theme: kingdoms
    built: false
    color: yellow
    title: "KINGDOMS"
    title-split: 0
    center: {x: 0, y: 100, z: 0}
    holograms:
      play:
        lines: ["&a&lJÁTÉK", "&7Kattints rám, vagy lépj", "&7be a portálba!"]
        action: play
      info:
        lines: ["&e&lHogyan játszd?", "&7Kattints rám!"]
        action: "info:mode_kingdoms"
  duels:
    world: lobby_duels
    theme: duels
    built: false
    color: yellow
    title: "DUELS"
    title-split: 0
    center: {x: 0, y: 100, z: 0}
    # A portál és a Játék gomb a Duels menüt nyitja meg
    play-command: "duels"
    holograms:
      play:
        lines: ["&e&lPÁRBAJ", "&7Kattints rám, vagy lépj", "&7be a portálba!"]
        action: play
      info:
        lines: ["&e&lHogyan játszd?", "&7Kattints rám!"]
        action: "info:mode_duels"
      top1:
        toplist: duelswins
        lines: []
      top2:
        toplist: duelselo
        lines: []
  bedwars:
    world: lobby_bedwars
    theme: bedwars
    built: false
    color: orange
    title: "BEDWARS"
    title-split: 3
    center: {x: 0, y: 100, z: 0}
    # A portál és a Játék gomb a BedWars menüt nyitja meg (módválasztó)
    play-command: "bw"
    holograms:
      play:
        lines: ["&6&lBEDWARS", "&7Kattints egy szoborra,", "&7vagy rám a menüért!"]
        action: play
      info:
        lines: ["&e&lHogyan játszd?", "&7Kattints rám!"]
        action: "info:mode_bedwars"
      top1:
        toplist: bedwarswins
        lines: []
      top2:
        toplist: bedwarsfinals
        lines: []
    # A négy szobor: rákattintva beszállsz az adott módba (action: "bedwars:<mód>"). A helyüket a lobby építése írja be.
    # Áthelyezés: állj oda, ahova kell, és /icem admin npc move modelobby_bedwars/solo (duo, 3v3v3v3, 4v4v4v4)
    npcs:
      solo:
        spot: statue1
        type: statue
        name: ["&c&lSOLO", "&78 csapat, 1 fő", "&f%bw_players_solo% &7játékos", "&e» Kattints a játékhoz! «"]
        action: "bedwars:solo"
        equipment:
          helmet: PLAYER_HEAD
          chestplate: "LEATHER_CHESTPLATE #B02E26"
          leggings: "LEATHER_LEGGINGS #B02E26"
          boots: "LEATHER_BOOTS #B02E26"
          hand: RED_BED
      duo:
