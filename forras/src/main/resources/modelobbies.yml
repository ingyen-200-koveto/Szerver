          leggings: "LEATHER_LEGGINGS #3C44AA"
          boots: "LEATHER_BOOTS #3C44AA"
          hand: BLUE_BED
      "3v3v3v3":
        spot: statue3
        type: statue
        name: ["&e&l3v3v3v3", "&74 csapat, 3 fő", "&f%bw_players_3v3v3v3% &7játékos", "&e» Kattints a játékhoz! «"]
