# Creative (telkes építés)
# Végtelen telekrács, mindenki kap saját telket, és azon kreatív módban építhet. A világot a plugin rajzolja meg
# (nem kell felépíteni), a telkek az IceMine adatbázisában vannak.
#
# Parancs: /plot (vagy /p, /telek). Admin (icemine.admin.creative): /plot admin clear|delete (azon a telken, ahol állsz),
# és mindenhol építhet. Korlátlan telek: icemine.creative.unlimited

world: creative

# A telek és az út mérete blokkban, a talaj magassága. Ezeket csak az első indítás előtt érdemes átírni,
# utána a már legenerált részen nem változnak.
plot:
  size: 48
  road: 7
  height: 64
  ground: GRASS_BLOCK
  fill: DIRT
  road-block: SMOOTH_STONE
  # A telek körüli félblokk: szabad telken és lefoglalton
  border: SMOOTH_STONE_SLAB
  border-claimed: QUARTZ_SLAB

# A központ (lobby) a telkek között: ezen a telken épül fel az első indításkor (built: true jelzi), ide érkezik
# mindenki, aki a Creative-ba jön, és ezt nem lehet lefoglalni. Újraépítés: /plot admin hub
hub:
  plot-x: 0
  plot-z: 0
  built: false

# A világ határa (blokk, átmérő)
border-size: 20000

# Hány telke lehet egy játékosnak: alapból, és rangonként (a ranks.yml azonosítói). A magasabb rang a gyengébbekét is megkapja.
# max: ennél több senkinek nem lehet (az icemine.creative.unlimited joggal sem).
limits:
  default: 1
  max: 2
  ranks:
    bronz: 2

# Egy telken legfeljebb ennyi entitás (mob, páncélállvány, keret, kocsi...) lehet. 0 = nincs korlát.
entities-per-plot: 40

# Ezeket nem lehet elővenni, lerakni vagy használni (az adminok kivételével).
blocked-items:
  - TNT
  - TNT_MINECART
  - END_CRYSTAL
  - RESPAWN_ANCHOR
  - SPAWNER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - DEBUG_STICK
  - WITHER_SPAWN_EGG
  - ENDER_DRAGON_SPAWN_EGG
  - WARDEN_SPAWN_EGG
  - ELDER_GUARDIAN_SPAWN_EGG
  - WITHER_SKELETON_SKULL
  - DRAGON_EGG

