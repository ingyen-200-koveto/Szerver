# SkyPvP
# A szigeteket az első indításkor a plugin építi fel. Újraépítés: /icemine rebuild skypvp confirm
# Aréna visszaállítás (lerakott blokkok törlése, ládák újratöltése): /icemine arena reset skypvp
# Tárgy formátum: ANYAG [darab] [varázslat:szint ...] [unbreakable]

world: ice_skypvp
built: false
center:
  x: 0
  y: 100
  z: 0
time: 6000
void-y: 70
hunger: false
heal-on-kill: 4
# A ládákból szerzett tárgyak halálkor leesnek (a kit tárgyak nem)
drop-loot: true

loot:
  refill-seconds: 180
  min-items: 3
  max-items: 6
  # ANYAG darab ... | súly (minél nagyobb, annál gyakoribb)
  normal:
    - "COOKED_BEEF 6 | 30"
    - "ARROW 12 | 25"
    - "SNOWBALL 16 | 20"
    - "PACKED_ICE 24 | 25"
    - "SNOW_BLOCK 32 | 25"
    - "IRON_SWORD 1 | 8"
    - "IRON_CHESTPLATE 1 | 6"
    - "IRON_LEGGINGS 1 | 6"
    - "IRON_HELMET 1 | 8"
    - "IRON_BOOTS 1 | 8"
    - "BOW 1 | 8"
    - "GOLDEN_APPLE 1 | 6"
    - "ENDER_PEARL 1 | 4"
    - "WATER_BUCKET 1 | 4"
  mid:
    - "DIAMOND_SWORD 1 | 6"
    - "DIAMOND_CHESTPLATE 1 | 4"
    - "DIAMOND_HELMET 1 | 5"
    - "DIAMOND_BOOTS 1 | 5"
    - "BOW 1 power:2 | 6"
    - "GOLDEN_APPLE 2 | 10"
    - "ENDER_PEARL 2 | 8"
    - "ARROW 24 | 15"
    - "IRON_SWORD 1 sharpness:2 | 8"
    - "PACKED_ICE 32 | 15"

blocks:
  # Ezeket lehet lerakni a harci zónában, és ennyi mp után eltűnnek
  allowed: [SNOW_BLOCK, PACKED_ICE, COBBLESTONE]
  decay-seconds: 45
  max-y: 130

default-kit: harcos
kits:
  harcos:
    name: "&f&lJégharcos"
    icon: STONE_SWORD
    description:
      - "&7Alap felszerelés, a többit"
      - "&7a ládákból szerzed."
    items:
      - "STONE_SWORD 1 unbreakable"
      - "WOODEN_PICKAXE 1 unbreakable"
      - "SNOW_BLOCK 32"
      - "COOKED_BEEF 8"
    armor:
      chestplate: "LEATHER_CHESTPLATE 1 unbreakable"
      boots: "LEATHER_BOOTS 1 unbreakable"
  ijasz:
    name: "&a&lHegyi íjász"
    icon: BOW
    description:
      - "&7Íjjal indul, de gyengébb páncéllal."
    items:
      - "WOODEN_SWORD 1 unbreakable"
      - "BOW 1 unbreakable"
      - "ARROW 16"
      - "SNOW_BLOCK 16"
      - "COOKED_BEEF 8"
    armor:
      helmet: "LEATHER_HELMET 1 unbreakable"
      boots: "LEATHER_BOOTS 1 unbreakable"
  epitesz:
    name: "&e&lÉpítész"
    icon: PACKED_ICE
    description:
      - "&7Sok blokk, gyors hidak,"
      - "&7meglepetés támadások."
    items:
      - "WOODEN_SWORD 1 unbreakable"
      - "STONE_PICKAXE 1 unbreakable"
      - "PACKED_ICE 64"
      - "SNOW_BLOCK 64"
      - "COOKED_BEEF 8"
    armor:
      chestplate: "LEATHER_CHESTPLATE 1 unbreakable"
  hopardusz:
    name: "&b&lHópárduc"
    icon: FEATHER
    description:
      - "&7Gyors és fürge, de sérülékeny."
    items:
      - "STONE_SWORD 1 unbreakable"
      - "SNOW_BLOCK 16"
      - "COOKED_BEEF 8"
    armor:
      boots: "LEATHER_BOOTS 1 feather_falling:3 unbreakable"
    effects:
      - "speed:1"
      - "jump_boost:1"

rewards:
  currency: kristaly
  kill: 8
  streak-bonus:
    3: 8
    5: 20
    10: 50
  same-victim-cooldown-seconds: 300
  same-ip-rewards: false
  daily-cap: 1500

broadcast-streaks: [5, 10, 15, 20]
