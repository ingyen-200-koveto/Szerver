# FullPvP
# Egy nagy pálya, középen biztonságos vár udvarral. A felszerelésed megmarad (kilépéskor elmentjük), halálkor kiesik,
# és aki megölt, felveheti. Ölésért kristály jár, abból a boltban veszel fegyvert, páncélt, ételt és bájitalt.
# A pályát az első indításkor a plugin építi fel. Újraépítés: /icem admin rebuild fullpvp confirm
# Spawn áthelyezése: állj oda, és /icem setspawn fullpvp
#
# Tárgy formátum: ANYAG [darab] [varázslat:szint ...] [unbreakable] [effect=effekt:szint:mp] [name=Név_szóközök_helyett]
#   pl. "DIAMOND_SWORD sharpness:2 fire_aspect:1", "SPLASH_POTION effect=instant_health:2:1 name=&dGyógyító_bájital"

world: ice_fullpvp
built: false
center:
  x: 0
  y: 80
  z: 0
time: 6000
void-y: 61
hunger: true
# Mennyit gyógyuljon a gyilkos egy ölés után (fél szívekben)
heal-on-kill: 4
# A játékos tárgyai halálkor kiesnek (a kezdő kit tárgyai nem)
drop-loot: true
# Ennyi XP szintet kap a gyilkos ölésenként (a vár udvarán lévő varázsasztalhoz)
xp-per-kill: 3

rewards:
  kill: 20
  # Extra jutalom egy adott sorozatnál
  streak-bonus:
    5: 30
    10: 75
    15: 150
    20: 300
  # Ugyanazért a játékosért ennyi ideig nem jár újra pénz (farmolás ellen)
  same-victim-cooldown-seconds: 300
  same-ip-rewards: false
  # Egy nap alatt legfeljebb ennyit lehet ölésekkel keresni (0 = nincs korlát)
  daily-cap: 6000

# Ezeknél a sorozatoknál mindenki látja a chatben
broadcast-streaks: [5, 10, 15, 20, 25, 30]

# Sorozat jutalmak (tárgyak), ezek a játékosé lesznek
streak-items:
  3: ["GOLDEN_APPLE 1"]
  5: ["GOLDEN_APPLE 2", "ENDER_PEARL 2"]
  10: ["ENCHANTED_GOLDEN_APPLE 1", "EXPERIENCE_BOTTLE 8"]
  15: ["DIAMOND_SWORD sharpness:3 unbreaking:2 name=&b&lSorozatkard"]
  25: ["TOTEM_OF_UNDYING 1"]

# Fejpénz: /fullpvp fejpenz <játékos> <összeg>. Aki megöli, megkapja.
bounty:
  min: 100
  max: 1000000

# Széf a vár udvarán (enderláda). icemine.fullpvp.vault.large joggal nagyobb.
vault:
  rows: 3
  rows-large: 6

# Halál után és az első belépéskor ezt kapja mindenki. Ezek a tárgyak nem esnek ki és nem tehetők a széfbe.
respawn-kit: kezdo

