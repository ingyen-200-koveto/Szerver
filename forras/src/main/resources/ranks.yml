# IceMine rangok
#
# Ebben a fájlban azt állítod be, hogy egy LuckPerms csoport mit kap az IceMine-ban:
# kozmetikákat, pénz szorzót és egyéb jogokat, és azt, hogy a LuckPermsben milyen legyen (luckperms rész).
#
# group: a LuckPerms csoport neve (kisbetű, ékezet és + jel nélkül, pl. sradmin).
#        A játékos a legmagasabb olyan rangot kapja, aminek a csoportjában benne van.
#        Az első rang (Játékos, jatekos csoport) mindenkinek jár: aki belép, és a LuckPermsben még csak a
#        default csoportban van, automatikusan megkapja.
# A sorrend számít: lefelé haladva egyre erősebb a rang, és mindegyik megkapja
# az összes fölötte lévő (gyengébb) rang jutalmát is.
#
# kits:        kit azonosítók (comboarena.yml). Amelyik kit egy rangnál szerepel, azt csak ez a rang
#              és az erősebbek használhatják. Ami sehol nem szerepel, ingyenes.
# cosmetics:   kozmetikák (lobby.yml -> cosmetics), pl. trail.kristaly, kill.villam
# permissions: IceMine jogok, amiket a rang kap (pl. icemine.cosmetic.fly = repülés a lobbyban)
# coin-multiplier: ennyivel szorozzuk a jutalmakat (BedWars, Gens, OneBlock eladás, napi jutalom)
# perks:       ez csak a rang menüben (/icem rank) jelenik meg, leírásnak
#
# luckperms:   a LuckPerms csoport beállításai. Az IceMine indításkor egyszer létrehozza a csoportot a LuckPermsben
#              (lp creategroup), beállítja a súlyát (weight), a nevét (display), az előtagját (prefix),
#              a szülő csoportját (parent) és a jogait (permissions, pl. Essentials és WorldEdit jogok).
#              Amit egyszer beállított, azt nem csinálja meg újra (plugins/IceMine/.luckperms-kesz fájl).
#              Ha újra kell: töröld abból a fájlból a csoport sorát, vagy az egész fájlt, és indítsd újra a szervert.
#
# Rangot adni (konzolba): lp user <játékos> parent add <csoport>   pl. lp user Peti parent add iceking

# Az IceMine hozza létre a csoportokat a LuckPermsben (false = nem nyúl a LuckPermshez)
luckperms-setup: true

# Hol lehet rangot venni (a rang menü alján jelenik meg)
store-url: "www.icemine.hu"

