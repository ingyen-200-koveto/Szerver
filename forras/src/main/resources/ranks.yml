# IceMine rangok
#
# A rang nevét, előtagját (prefix) és chat színét a LuckPerms adja, azt te írod meg ott.
# Ebben a fájlban azt állítod be, hogy egy LuckPerms csoport mit kap az IceMine-ban:
# kiteket, kozmetikákat, pénz szorzót és egyéb jogokat.
#
# group: a LuckPerms csoport neve (kisbetű, ékezet és + jel nélkül, pl. vipplus).
#        A játékos a legmagasabb olyan rangot kapja, aminek a csoportjában benne van.
# A sorrend számít: lefelé haladva egyre erősebb a rang, és mindegyik megkapja
# az összes fölötte lévő (gyengébb) rang jutalmát is.
#
# kits:        kit azonosítók (kitpvp.yml, skypvp.yml, comboarena.yml). Amelyik kit egy rangnál
#              szerepel, azt csak ez a rang és az erősebbek használhatják. A "default" rang kitjei ingyenesek.
# cosmetics:   kozmetikák (lobby.yml -> cosmetics), pl. trail.kristaly, kill.villam
# permissions: bármilyen egyéb jog, amit a rang kap (pl. icemine.cosmetic.fly = repülés a lobbyban)
# coin-multiplier: ennyivel szorozzuk az ölésért és a napi jutalomért járó pénzt
# perks:       ez csak a rang menüben (/icem rank) jelenik meg, leírásnak
#
# LuckPerms példa (egyszer kell beírni a konzolba):
#   lp creategroup vip
#   lp group vip parent add default
#   lp group vip meta setprefix 100 "&a[VIP] "
#   lp user <játékos> parent add vip

# Hol lehet rangot venni (a rang menü alján jelenik meg)
store-url: "https://discord.gg/icemine"

