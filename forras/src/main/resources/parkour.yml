# Lobby parkour: színes gyapjú kockák, mindig csak a következő kocka jelenik meg,
# amikor ráugrottál az előzőre. A pályát (56 kocka) a lobby építésekor a plugin tölti ki.
# A startot kézzel is beállíthatod: /icem admin parkour start | fail

enabled: true
# Ennél gyorsabb időt nem fogad el (ms) - védelem a csalás ellen
min-time-ms: 25000
# Ha ennyi blokkal a mostani kockád alá esel, visszakerülsz a legutóbbi ellenőrzőpontra
fall-depth: 3
# Minden hányadik kocka ellenőrzőpont (zöld gyapjú). A cél az utolsó kocka (aranyblokk).
checkpoint-every: 14
# Ennyi perc után magától megszakad
max-time-minutes: 15

rewards:
  currency: kristaly
  # Első teljesítés
  first: 500
  # Új egyéni rekord
  record: 100
  # Sima teljesítés (csak ennyi óránként jár)
  repeat: 25
  repeat-cooldown-hours: 12

course: {}
