# IceMine lobby
# Az első indításkor a plugin felépíti a lobbyt (falu, vár, IceMine felirat, spawn platform,
# parkour), és ide beírja a fontos pontokat (spawn, hologramok, NPC-k, ugrólapok).
# Ezeket utána nyugodtan átírhatod, vagy játékban áthelyezheted:
#   /icemine setlobby, hologram move <id>, npc move <id>
# Ha újra akarod építeni: /icemine rebuild lobby confirm
#
# NPC-k (npcs rész):
#   type: statue (páncélállvány szobor, felszereléssel) vagy villager (falusi)
#   name: a feje fölötti szöveg. Használható: %online_<mód>% %mode_name_<mód>% %status_<mód>% %online%
#   action: mode:<mód> | menu:<menü> | command:<parancs> | message:<szöveg> | book:contacts
#   equipment: helmet, chestplate, leggings, boots, hand. Bőrpáncélhoz szín is adható: "LEATHER_CHESTPLATE #7FD0FF"
#   Ha a Citizens plugin fent van, minden NPC élő, játékos kinézetű NPC lesz (Citizens NPC), és a játékosok felé fordul.
#   skin: annak a Minecraft játékosnak a neve, akinek a skinjét viselje (pl. skin: "Notch"). Üres = alap skin.
#   citizens: a Citizens NPC száma, ezt a plugin írja be, ne írd át.
#   A kézben lévő tárgy a hand sorból jön, a többi páncél Citizensnél nem kerül fel, hogy látszódjon a skin.
# Ugrólapok (launchpads rész): location = a nyomólap helye, target = ahova dobja a játékost.

# Üres = a szerver fő világa (a server.properties level-name értéke)
world: ""
built: false
center:
  x: 0
  y: 100
  z: 0

# A napszak (6000 = dél, 13000 = alkonyat, 18000 = éjfél)
time: 6000
# Ha valaki ez alá esik, visszakerül a spawnra (vagy parkour közben az ellenőrzőpontra)
void-y: 60
# Belépéskor mindenki a lobbyba kerül
join-to-lobby: true
# Ha egy lobby tárgy vagy kit tárgy rossz helyre kerülne, a plugin elveszi
cleanup-foreign-items: true

protection:
  # Ezekre a blokkokra lehet jobb klikkelni a lobbyban (pl. ajtók). Alapból semmire.
  allow-interact: []

hotbar:
  enabled: true
  items:
    selector:
      slot: 0
      material: COMPASS
      name: "&b[IceMine] &fJátékmódok"
      lore:
        - "&7Kattints, és válassz játékmódot!"
      action: "menu:selector"
    profile:
      slot: 1
      material: PLAYER_HEAD
      name: "&b&lProfil"
      lore:
        - "&7A statisztikáid és a pénzed."
      action: "menu:profile"
    cosmetics:
      slot: 3
      material: AMETHYST_SHARD
      name: "&d&lKozmetikák"
      lore:
        - "&7Nyomvonalak és ölés effektek."
      action: "menu:cosmetics"
    parkour:
      slot: 5
      material: FEATHER
      name: "&f&lJégparkour"
      lore:
        - "&7Ugrás a parkour startjához."
      action: "parkour:start"
    settings:
      slot: 7
      material: COMPARATOR
      name: "&7&lBeállítások"
      lore:
        - "&7Játékosok elrejtése, repülés és társai."
      action: "menu:settings"
    info:
      slot: 8
      material: HEART_OF_THE_SEA
      name: "&3&lInformációk"
      lore:
        - "&7Hasznos tudnivalók a szerverről."
      action: "menu:info"

# Kozmetikák: a nyomvonal minden játékmódban látszik (a parkour futás alatt nem),
# az ölés effekt akkor jelenik meg, amikor megölsz valakit (bármelyik PvP módban).
# Megnyitás: iránytű / hotbar, vagy bárhol: /kozmetika
# Jog: icemine.cosmetic.trail.<id> és icemine.cosmetic.kill.<id> (LuckPerms-szel rangokhoz adhatod)
cosmetics:
  # Ezekben a világokban nincs nyomvonal (pl. "kingdoms")
  disabled-worlds: []
  trails:
    ho:
      name: "&fHópelyhek"
      icon: SNOWBALL
      particle: SNOWFLAKE
      count: 3
      permission: icemine.cosmetic.trail.ho
      description:
        - "&7Hópelyhek szállingóznak utánad."
    kristaly:
      name: "&bKristálypor"
      icon: END_ROD
      particle: END_ROD
      count: 2
      permission: icemine.cosmetic.trail.kristaly
      description:
        - "&7Csillogó kristálypor nyomvonal."
    fagy:
      name: "&3Fagyos szikrák"
      icon: PRISMARINE_CRYSTALS
      particle: ELECTRIC_SPARK
      count: 3
      permission: icemine.cosmetic.trail.fagy
      description:
        - "&7Pattogó, fagyos szikrák."
    felho:
      name: "&7Felhők"
      icon: WHITE_WOOL
      particle: CLOUD
      count: 2
      permission: icemine.cosmetic.trail.felho
      description:
        - "&7Mintha felhőkön járnál."
    szikra:
      name: "&eÜnnepi szikrák"
      icon: FIREWORK_STAR
      particle: FIREWORK
      count: 2
      permission: icemine.cosmetic.trail.szikra
      description:
        - "&7Tűzijáték szikrák minden lépésnél."
  kill-effects:
    szilank:
      name: "&bJégszilánkok"
      icon: ICE
      particle: BLOCK
      block: ICE
      count: 40
      sound: "minecraft:block.glass.break"
      permission: icemine.cosmetic.kill.szilank
      description:
        - "&7Az ellenfél jégszilánkokra törik."
    villam:
      name: "&eVillámcsapás"
      icon: LIGHTNING_ROD
      lightning: true
      permission: icemine.cosmetic.kill.villam
      description:
        - "&7Villám csap le oda, ahol meghalt."
    tuzijatek:
      name: "&dTűzijáték"
      icon: FIREWORK_ROCKET
      particle: FIREWORK
      count: 60
      sound: "minecraft:entity.firework_rocket.twinkle"
      permission: icemine.cosmetic.kill.tuzijatek
      description:
        - "&7Ünnepeld meg minden öléssel!"
    szivek:
      name: "&cSzívek"
      icon: RED_DYE
      particle: HEART
      count: 14
      sound: "minecraft:entity.player.levelup"
      permission: icemine.cosmetic.kill.szivek
      description:
        - "&7Kedvesen búcsúzol tőle."
    lelek:
      name: "&3Lélekláng"
      icon: SOUL_LANTERN
      particle: SOUL_FIRE_FLAME
      count: 45
      sound: "minecraft:particle.soul_escape"
      permission: icemine.cosmetic.kill.lelek
      description:
        - "&7Kék lángok csapnak fel."
    robbanas:
      name: "&6Robbanás"
      icon: TNT
      particle: EXPLOSION
      count: 3
      sound: "minecraft:entity.generic.explode"
      permission: icemine.cosmetic.kill.robbanas
      description:
        - "&7Látványos, de senkinek nem árt."

menus:
  main:
    title: "&3[IceMine] &8Főmenü"
  selector:
    title: "&3[IceMine] &8Játékmódok"
  profile:
    title: "&3[IceMine] &8Profil"
  stats:
