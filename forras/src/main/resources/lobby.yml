# A chatre kiírt információk. A chatben a /parancsokra és a linkekre rá lehet kattintani.
# Saját kattintható rész: [[szöveg|run:/parancs]], [[szöveg|suggest:/parancs ]], [[szöveg|url:https://...]]
info-hover:
  command: "&7Kattints: &f%value%"
  link: "&7Kattints a megnyitáshoz"
info-texts:
  server:
    - "&8&m                                             "
    - " &b&lA szerverről"
    - " &7IP: &fplay.icemine.hu"
    - " &7Verziók: &f1.18 - 1.20.x &7(Java és Bedrock)"
    - " &7Warez kliensről is be lehet lépni."
    - " &7Discord: &bhttps://discord.gg/icemine"
    - "&8&m                                             "
  rules:
    - "&8&m                                             "
    - " &e&lSzabályok"
    - " &7- Ne csalj, ne használj hackeket és makrót."
    - " &7- Ne sértegess és ne fenyegess senkit."
    - " &7- Ne hirdess más szervert."
    - " &7- Harc közben ne lépj ki."
    - " &7Ha valaki szabályt szeg, szólj a [[&b&nDiscordon|url:https://discord.gg/icemine]]&7!"
    - "&8&m                                             "
  commands:
    - "&8&m                                             "
    - " &a&lHasznos parancsok &8(kattints rájuk!)"
    - " &f/lobby &8- &7vissza a lobbyba"
    - " &f/spawn &8- &7a játékmód kezdőpontja"
    - " &f/profil &8- &7a statisztikáid"
    - " &f/penz &8| [[&f/fizet|suggest:/fizet ]] &8- &7pénz, utalás"
    - " &f/napi &8- &7napi jutalom"
    - " &f/kozmetika &8- &7nyomvonalak és ölés effektek"
    - " &f/kapcsolat &8- &7elérhetőségeink"
    - "&8&m                                             "
  mode_kitpvp:
    - "&8&m                                             "
    - " &c&lKitPvP &8- &7hogyan játszd?"
    - " &7Válassz kitet a hotbar ládájával, aztán ugorj le"
    - " &7a kiemelt lobbyból a lapos jégmezőre."
    - " &7Minden ölés pénzt ér, a sorozatokért extra jár."
    - " &7Harc közben nem mehetsz vissza a védett részre."
    - " &7Vissza a kezdőpontra: /spawn"
    - "&8&m                                             "
  mode_skypvp:
    - "&8&m                                             "
    - " &b&lSkyPvP &8- &7hogyan játszd?"
    - " &7Lebegő jégszigeteken játszol, a ládákban cuccot találsz."
    - " &7A ládák időnként újratöltődnek, a közép a legjobb."
    - " &7Mindenki mindenki ellen, minden ölés pénzt ér."
    - " &7Vissza a kezdőpontra: /spawn"
    - "&8&m                                             "
  mode_combofly:
    - "&8&m                                             "
    - " &d&lComboFly &8- &7hogyan játszd?"
    - " &7A spawnon a kit NPC-től kapod meg a felszerelést."
    - " &7Üsd egymás után az ellenfelet, és tartsd a levegőben:"
    - " &7minél tovább nem ér földet, annál nagyobb a kombód."
    - " &7A piros gyapjúval jelölt közép védett zóna,"
    - " &7harc közben oda nem mehetsz be."
    - " &7Beállítások: /combofly"
    - "&8&m                                             "
  mode_gens:
    - "&8&m                                             "
    - " &a&lGens &8- &7hogyan játszd?"
    - " &7Saját farm szigetet kapsz, a növényeket kapával aratod."
    - " &7A termést a hordónál adod el, vagy: /elad"
    - " &7A pénzből új földeket nyitsz és fejleszted a kapádat."
    - " &7Napi küldetések is vannak, nézd meg a menüt: /gens"
    - "&8&m                                             "
  mode_kingdoms:
    - "&8&m                                             "
    - " &6&lKingdoms &8- &7hogyan játszd?"
    - " &7Túlélő világ, ahol királyságot alapíthatsz."
    - " &7Foglalj területet, hívd meg a barátaidat,"
    - " &7és védd meg a birodalmad a többiektől."
    - " &7Parancsok: /k help"
    - "&8&m                                             "
  mode_duels:
    - "&8&m                                             "
    - " &e&lDuels &8- &7hogyan játszd?"
    - " &7Nyisd meg a menüt (/duels), és válassz módot."
    - " &7Unranked sorban bárkivel összekerülsz, a ranked"
    - " &7sorban hozzád hasonló Elo-jú ellenfelet kapsz."
    - " &7Barátot kihívni: /duel <név> &8(bo3: /duel <név> bo3)"
    - " &7Nézőként: /duels spectate <név>"
    - "&8&m                                             "
  mode_bedwars:
    - "&8&m                                             "
    - " &6&lBedWars &8- &7hogyan játszd?"
    - " &7Válassz módot a menüben (/bw): Solo, Duó, 3v3v3v3, 4v4v4v4."
    - " &7A bázisod generátora vasat és aranyat ad, a kis szigeteken"
    - " &7gyémánt, középen smaragd van. A boltban cuccot veszel,"
    - " &7a másik NPC-nél csapatfejlesztést és csapdát."
    - " &7Védd meg az ágyad: amíg áll, újraéledsz. Rombold le a többiekét!"
    - " &7Nézőként: /bw nez <név>"
    - "&8&m                                             "
  parkour:
    - "&8&m                                             "
    - " &b&lJégparkour"
    - " &7Lépj a nyomólapra a start kapuban, és indul az óra."
    - " &7Útközben ellenőrzőpontok vannak, ha leesel, onnan folytatod."
    - " &7Első teljesítésért és új rekordért kristály jár!"
    - " &7Rekord: &f%parkour_record%"
    - "&8&m                                             "

